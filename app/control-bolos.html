<title>Mis Bolos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2563c9">
<style>
/* Layout: plain Android-style app. Top bar with period, white cards on a light grey ground, bottom navigation, bottom-sheet forms. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f3; --fg:#1b1d21; --muted:#646a73; --line:#e1e4e8;
  --accent:#2563c9; --accent-fg:#ffffff; --accent-soft:#e3ecfb;
  --ok:#1e7a45; --ok-bg:#e2f3e8; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#b4332c; --bad-bg:#fbe4e2;
  --info:#2457a8; --info-bg:#e1eaf8; --idea:#6b4fa0; --idea-bg:#eee8f7;
  --font:system-ui,-apple-system,"Roboto","Segoe UI",Helvetica,Arial,sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1c1e21; --surface-2:#26292d; --fg:#eceef1; --muted:#9aa0a8; --line:#2f3337;
  --accent:#7aa7f5; --accent-fg:#0d1a33; --accent-soft:#1d2a40;
  --ok:#6fcf93; --ok-bg:#1b3125; --warn:#e8b65a; --warn-bg:#352a15; --bad:#f08a83; --bad-bg:#3b2120;
  --info:#8ab2f0; --info-bg:#1d2a3e; --idea:#b8a2e8; --idea-bg:#2b2540; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1c1e21; --surface-2:#26292d; --fg:#eceef1; --muted:#9aa0a8; --line:#2f3337;
  --accent:#7aa7f5; --accent-fg:#0d1a33; --accent-soft:#1d2a40;
  --ok:#6fcf93; --ok-bg:#1b3125; --warn:#e8b65a; --warn-bg:#352a15; --bad:#f08a83; --bad-bg:#3b2120;
  --info:#8ab2f0; --info-bg:#1d2a3e; --idea:#b8a2e8; --idea-bg:#2b2540; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.icon-btn{border:0;background:transparent;border-radius:50%;width:40px;height:40px;display:grid;place-items:center}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:var(--fg)}
.period{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:12px;padding:4px}
.period .label{flex:1;text-align:center;font-weight:600;font-size:16px}
.period .label::first-letter{text-transform:uppercase}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4}

.banner{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

h2{font-size:14px;font-weight:600;color:var(--muted);margin:24px 4px 8px}
h2:first-child{margin-top:4px}
h2::first-letter{text-transform:uppercase}
.card{background:var(--surface);border-radius:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;font-size:15px}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* summary */
.hero{padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero-main .big{font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero-main .cap{font-size:14px;color:var(--muted);margin-bottom:4px}
.ledger{display:flex;flex-direction:column;gap:8px;font-size:15px;border-top:1px solid var(--line);padding-top:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger .num{font-weight:600}
.ledger .pos{color:var(--ok)} .ledger .neg{color:var(--bad)}
.ledger.sub{font-size:14px;color:var(--muted)}
.ledger.sub strong{color:var(--fg)}

/* lists */
.stack{display:flex;flex-direction:column;background:var(--surface);border-radius:16px;overflow:hidden}
.stack>*{border-bottom:1px solid var(--line)}
.stack>*:last-child{border-bottom:0}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;background:transparent;border:0;text-align:left;width:100%}
.row:active{background:var(--surface-2)}
.row.cancel{opacity:.55}
.rowwrap{display:flex;gap:6px;align-items:center;padding-right:10px}
.rowwrap>.row{flex:1;min-width:0;width:auto}
.datebox{flex:none;width:44px;height:48px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.datebox .d{font-weight:700;font-size:18px;line-height:1.1}
.datebox .w{font-size:11px;color:var(--muted)}
.row-body{flex:1;min-width:0}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{flex:none;text-align:right}
.row-amt .a{font-weight:600;font-variant-numeric:tabular-nums}
.row-amt .b{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip,.gel{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)} .c-idea{background:var(--idea-bg);color:var(--idea)} .c-plain{background:var(--surface-2);color:var(--muted)}
.dot,.sw{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-info{background:var(--info)} .d-idea{background:var(--idea)}
.mini-btn{border:0;background:var(--ok-bg);color:var(--ok);border-radius:50%;flex:none}
.mini-btn.go{width:38px;height:38px;padding:0;display:grid;place-items:center}
.mini-btn svg{width:20px;height:20px}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px}
.cal .hd{font-size:12px;text-align:center;color:var(--muted);padding-bottom:4px}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500}
.cal button.out{visibility:hidden}
.cal button.today{color:var(--accent);font-weight:700}
.cal button.sel{background:var(--accent);color:var(--accent-fg)}
.cal button:not(.sel):active{background:var(--surface-2)}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dot{width:6px;height:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}

/* bottom navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;padding:0;box-sizing:content-box;border-radius:999px}
.tabbar button[aria-current="page"]{color:var(--fg);font-weight:600}
.tabbar button[aria-current="page"] svg{background:var(--accent-soft);color:var(--accent);padding:4px 18px;margin:-4px 0}
.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);height:56px;padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px;stroke:currentColor}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:600px;margin:0 auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:20px;font-weight:700;margin:0 0 16px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:14px;font-weight:500}
.radios span.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.radios input:focus-visible + span{outline:2px solid var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.calc{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:1}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--bg);border-radius:10px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.cats{display:flex;flex-direction:column;gap:10px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* additions: next gig, tasks, quick actions, tables, search */
.today-btn{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;flex:none}
.nextcard{overflow:hidden}
.nextmain{display:block;width:100%;text-align:left;border:0;background:transparent;padding:16px 18px 14px}
.nextmain:active{background:var(--surface-2)}
.when{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px}
.when::first-letter{text-transform:uppercase}
.nexttitle{font-size:20px;font-weight:700;line-height:1.25}
.nextmeta{font-size:15px;color:var(--muted);margin-top:2px}
.nextmain .chips{margin-top:10px}
.nextfoot{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:11px 18px;border-top:1px solid var(--line);font-size:14px}
.nextfoot a{color:var(--accent);font-weight:600;text-decoration:none}
.sel{user-select:all;-webkit-user-select:all;color:var(--fg)}
.debt-late{color:var(--bad);font-size:14px;font-weight:500}
.task-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 14px 14px 72px}
.task-actions .q{flex-basis:100%;font-size:14px;color:var(--muted)}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:600}
.qbtn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.qbtn.no{color:var(--bad)}
.qbtn:disabled{opacity:.5}
.quickbar{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 18px}
details.more{border:1px solid var(--line);border-radius:12px}
details.more>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0}
details.more[open]>summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
details.more .fields{display:flex;flex-direction:column;gap:14px;padding:2px 14px 14px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-size:16px;margin-bottom:12px}
.search:focus{outline:none;border-color:var(--accent)}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:12px;font-weight:600;color:var(--muted);text-align:right;padding:11px 10px 7px;white-space:nowrap}
.tbl td{padding:10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:14px}
.tbl th:last-child,.tbl td:last-child{padding-right:14px}
.tbl tr.tot td{font-weight:700}
.tbl td.dim{color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.toast{display:flex;align-items:center;gap:14px}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0;flex:none}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1 class="brand">Mis Bolos</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="seg" role="group" aria-label="Periodo">
          <button id="mode-mes" type="button" aria-pressed="true">Mes</button>
          <button id="mode-anio" type="button" aria-pressed="false">Año</button>
        </div>
        <button class="icon-btn" id="btn-ojo" type="button" aria-label="Ocultar cantidades" aria-pressed="false"></button>
        <button class="icon-btn" id="btn-ajustes" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="period">
      <button class="icon-btn" id="prev" type="button" aria-label="Periodo anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="label" id="period-label">—</div>
      <button class="today-btn" id="hoy" type="button" hidden>Hoy</button>
      <button class="icon-btn" id="next" type="button" aria-label="Periodo siguiente"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fab-label">Nuevo bolo</span></button>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button type="button" data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Resumen</button>
    <button type="button" data-tab="bolos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bolos</button>
    <button type="button" data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2-3-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Gastos</button>
    <button type="button" data-tab="empresas"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>Empresas</button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div><div id="sheet-body"></div></div></section>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const ESTADOS = {
  posible:{label:"Posible",cls:"idea"},
  reserva:{label:"En reserva",cls:"warn"},
  confirmado:{label:"Confirmado",cls:"ok"},
  realizado:{label:"Realizado",cls:"info"},
  cancelado:{label:"Cancelado",cls:"bad"}
};
const PAGOS = {pendiente:"Sin cobrar",parcial:"Cobrado en parte",pagado:"Cobrado"};
const CATS = {transporte:"Gasolina / transporte",km:"Kilometraje",peaje:"Peajes y parking",dietas:"Comidas y dietas",alojamiento:"Alojamiento",material:"Material y herramientas",formacion:"Formación",cuota:"Cuota de autónomos",gestoria:"Gestoría",otros:"Otros"};
const PUESTOS = ["Técnico de iluminación","Jefe de iluminación","Operador de mesa","Programador","Montaje / desmontaje","Cañón de seguimiento","Rigger","Diseño de iluminación","Técnico de vídeo","Auxiliar"];
const DEF_AJUSTES = {km:0.26,plazo:30,gcalOn:false,gcalNombre:"Mis Bolos",gcalId:""};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const LS_KEY = "mis-bolos-v1";
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- state ---------- */
const S = {
  bolos:new Map(), gastos:new Map(), empresas:new Map(), ajustes:{...DEF_AJUSTES},

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(today);
const parse = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };
const fmtEUR = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:2});
let OCULTO=false; try{ OCULTO = localStorage.getItem("mis-bolos-ocultar")==="1"; }catch(e){}
const eur = n => OCULTO ? "••• €" : fmtEUR.format(Math.round((n||0)*100)/100);
const OJO_ABIERTO='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const OJO_CERRADO='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.6 3.5M6.6 6.6C3.9 8.4 2 12 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M3 3l18 18"/></svg>';
const fmtN = n => String(Math.round(n*10)/10).replace(".",",");
const fmtDate = s => { if(!s) return ""; const d=parse(s); return d.getDate()+" "+MESES[d.getMonth()].slice(0,3); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const slug = s => norm(String(s||"").trim()).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80) || "sin-empresa";
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const suma = (arr,fn) => arr.reduce((s,x)=>s+fn(x),0);
const plural = (n,uno,varios) => n+" "+(n===1?uno:varios);

function toast(msg,undo){
  const t=$("#toast"); t.textContent="";
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  if(undo){ const b=document.createElement("button"); b.type="button"; b.textContent="Deshacer"; b.addEventListener("click",()=>{ t.hidden=true; undo(); }); t.appendChild(b); }
  t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,undo?6500:2600);
}

/* ---------- domain ---------- */
const bolosArr = () => [...S.bolos.entries()].map(([id,b])=>({...b,id})).filter(b=>typeof b.fecha==="string"&&b.fecha);
const gastosArr = () => [...S.gastos.entries()].map(([id,g])=>({...g,id})).filter(g=>typeof g.fecha==="string"&&g.fecha);
const baseDe = b => b.tipoPrecio==="jornada" ? num(b.precio)*Math.max(num(b.jornadas)||1,0) : num(b.precio);
const importe = b => baseDe(b)+num(b.extras);
const activo = b => b.estado==="confirmado" || b.estado==="realizado";
const finDe = b => b.fechaFin && b.fechaFin>=b.fecha ? b.fechaFin : b.fecha;
/* a confirmed gig whose date has passed counts as done without having to mark it */
const estadoEf = b => b.estado==="confirmado" && finDe(b)<TODAY ? "realizado" : (ESTADOS[b.estado] ? b.estado : "posible");
const hecho = b => estadoEf(b)==="realizado";
const cobradoDe = b => b.pago==="pagado" ? importe(b) : b.pago==="parcial" ? Math.min(num(b.cobrado),importe(b)) : 0;
const pendienteDe = b => activo(b) ? Math.max(importe(b)-cobradoDe(b),0) : 0;
/* money owed for work already done (a future confirmed gig is not a debt yet) */
const deudaDe = b => (hecho(b) || b.pago==="parcial") ? pendienteDe(b) : 0;
const gastosDe = id => gastosArr().filter(g=>g.boloId===id);
const plazoDe = nombre => { const e=S.empresas.get(slug(nombre)); return e && num(e.plazo)>0 ? num(e.plazo) : num(S.ajustes.plazo)||30; };
const atrasado = b => hecho(b) && deudaDe(b)>0 && daysBetween(finDe(b),TODAY) > plazoDe(b.empresa);
function inPeriod(s){ if(!s) return false; return UI.mode==="mes" ? s.startsWith(UI.y+"-"+pad(UI.m+1)) : s.startsWith(UI.y+"-"); }
function periodLabel(){ return UI.mode==="mes" ? MESES[UI.m]+" "+UI.y : "Año "+UI.y; }
function periodoTexto(){ return UI.mode==="mes" ? MESES[UI.m]+" de "+UI.y : String(UI.y); }
function periodoActual(){ return UI.y===today.getFullYear() && (UI.mode==="anio" || UI.m===today.getMonth()); }
function periodoPasado(){ return UI.y<today.getFullYear() || (UI.mode==="mes" && UI.y===today.getFullYear() && UI.m<today.getMonth()); }
function empresasNombres(){ const set=new Map(); bolosArr().forEach(b=>{ if(b.empresa) set.set(slug(b.empresa),b.empresa); }); S.empresas.forEach((e,k)=>{ if(e.nombre && !set.has(k)) set.set(k,e.nombre); }); return [...set.values()].sort((a,b)=>a.localeCompare(b,"es")); }
function lugares(){ const s=new Set(); bolosArr().forEach(b=>b.lugar&&s.add(b.lugar)); gastosArr().forEach(g=>g.lugar&&s.add(g.lugar)); return [...s].sort((a,b)=>a.localeCompare(b,"es")); }
function ultimoDe(empresa,exceptId){
  if(!String(empresa||"").trim()) return null;
  const k=slug(empresa);
  return bolosArr().filter(b=>b.empresa && slug(b.empresa)===k && b.id!==exceptId && num(b.precio)>0).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]||null;
}
function conflictos(){
  const act = bolosArr().filter(b=>b.estado!=="cancelado" && b.estado!=="posible" && finDe(b)>=TODAY);
  const out=[];
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    const a=act[i], b=act[j];
    if(a.fecha<=finDe(b) && b.fecha<=finDe(a)) out.push([a,b]);
  }
  return out;
}
function cuando(b){
  const d=daysBetween(TODAY,b.fecha);
  const dia=DIAS[parse(b.fecha).getDay()]+" "+fmtDate(b.fecha);
  if(d<0) return "En curso · hasta el "+fmtDate(finDe(b));
  if(d===0) return "Hoy · "+dia;
  if(d===1) return "Mañana · "+dia;
  return "En "+d+" días · "+dia;
}
/* things that need a decision from the user */
function tareas(){
  const out=[];
  bolosArr().forEach(b=>{
    const abierto = b.estado==="posible" || b.estado==="reserva";
    if(abierto && finDe(b)<TODAY) out.push({tipo:"cerrar",orden:1,b});
    else if(abierto && daysBetween(TODAY,b.fecha)<=7) out.push({tipo:"confirmar",orden:0,b});
  });
  return out.sort((x,y)=>x.orden-y.orden || x.b.fecha.localeCompare(y.b.fecha));
}

/* ---------- storage layer: artifact db, or this device as fallback ---------- */
const Store = {
  db:null,
  async init(){
    let db=null;
    try{ db = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null; }catch(e){ db=null; }
    if(db){ this.db=db; S.storeKind="nube"; this.subscribe(); }
    else { S.storeKind="local"; this.loadLocal(); S.loaded=true; render(); }
  },
  subscribe(){
    const pending = new Set(["bolos","gastos","empresas","ajustes"]);
    const timer = setTimeout(()=>{ if(pending.size){ S.note="Los datos tardan en llegar. Revisa la conexión; se cargarán solos."; renderBanner(); } },10000);
    const done = (k,fromCache)=>{ if(!fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); if(S.note.startsWith("Los datos")) S.note=""; } } S.loaded=true; render(); };
    const onErr = e => { clearTimeout(timer); S.note = e && e.code==="revoked" ? "Ya no hay acceso a los datos en esta vista." : "No se pudieron cargar los datos ("+(e&&e.code||"error")+"). Cierra y vuelve a abrir la app."; S.loaded=true; render(); };
    ["bolos","gastos","empresas"].forEach(col=>{
      this.db.collection(col).onSnapshot(snap=>{
        S[col] = new Map(snap.docs.map(d=>[d.id,d.data()]));
        done(col,snap.metadata.fromCache);
      },onErr);
    });
    this.db.doc("ajustes/general").onSnapshot(s=>{
      S.ajustes = {...DEF_AJUSTES,...(s.exists?s.data():{})};
      done("ajustes",s.metadata.fromCache);
    },onErr);
  },
  loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){ const o=JSON.parse(raw);
        S.bolos=new Map(Object.entries(o.bolos||{})); S.gastos=new Map(Object.entries(o.gastos||{}));
        S.empresas=new Map(Object.entries(o.empresas||{})); S.ajustes={...DEF_AJUSTES,...(o.ajustes||{})}; }
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem(LS_KEY,JSON.stringify({bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes})); }
    catch(e){ toast("No se pudo guardar en este dispositivo"); }
  },
  async put(col,id,data){
    if(this.db){
      try{ if(col==="ajustes") await this.db.doc("ajustes/general").set(data); else await this.db.collection(col).doc(id).set(data); return true; }
      catch(e){ toast(e&&e.code==="quota_exceeded" ? "Sin espacio: borra registros antiguos" : "No se pudo guardar. Inténtalo otra vez"); return false; }
    }
    if(col==="ajustes") S.ajustes={...DEF_AJUSTES,...data}; else S[col].set(id,data);
    this.saveLocal(); render(); return true;
  },
  async del(col,id){
    if(this.db){ try{ await this.db.collection(col).doc(id).delete(); return true; }catch(e){ toast("No se pudo borrar"); return false; } }
    S[col].delete(id); this.saveLocal(); render(); return true;
  }
};

/* ---------- Google Calendar (separate calendar, chosen by name) ---------- */
const GC_SERVER = "Google Calendar";
const GC_COLORS = {posible:"3",reserva:"5",confirmado:"10",realizado:"9"};
const GC_PREFIX = {posible:"[Posible] ",reserva:"[Reserva] ",confirmado:"",realizado:""};
const GC_FATAL = ["server_not_connected","needs_reauth","not_in_manifest","approval_required","blocked_by_policy","not_granted","consent_required"];
const GCal = {
  mcp:null,
  async get(){ if(this.mcp) return this.mcp; try{ this.mcp = window.claude ? await window.claude.use("mcp") : null; }catch(e){ this.mcp=null; } return this.mcp; },
  enabled(){ return !!(S.ajustes.gcalOn && S.ajustes.gcalId); },
  errText(e){
    const c=e&&e.code;
    if(c==="server_not_connected") return "Google Calendar no está conectado en tu cuenta de Claude (Ajustes → Conectores).";
    if(c==="needs_reauth") return "Vuelve a conectar Google Calendar en Ajustes de Claude → Conectores.";
    if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "Falta tu permiso para que la app use Google Calendar. Vuelve a intentarlo y pulsa Permitir.";
    if(c==="blocked_by_policy") return "Tu organización no permite usar Google Calendar aquí.";
    if(c==="server_unavailable") return "Google Calendar no responde ahora. Inténtalo en un rato.";
    if(c==="not_granted") return "Esta vista no puede usar Google Calendar. Abre la app desde Claude.";
    return "No se pudo actualizar Google Calendar"+(c?" ("+c+")":"")+".";
  },
  async call(tool,input){ const m=await this.get(); if(!m) throw {code:"not_granted"}; const r=await m.callTool(GC_SERVER,tool,input); return r ? r.payload : null; },
  async findCalendar(nombre){
    const p=await this.call("list_calendars",{pageSize:250});
    const list=(p&&(p.calendars||p.items))||[];
    const want=String(nombre||"").trim().toLowerCase();
    const hit=list.find(c=>String(c.summary||"").trim().toLowerCase()===want);
    return hit ? hit.id : "";
  },
  addDay(s){ const d=parse(s); d.setDate(d.getDate()+1); return iso(d); },
  eventFor(b){
    const ef=estadoEf(b);
    const titulo=(GC_PREFIX[ef]||"")+(b.evento||b.empresa||"Bolo")+(b.evento&&b.empresa?" · "+b.empresa:"");
    const lines=[b.empresa&&"Empresa: "+b.empresa,b.lugar&&"Lugar: "+b.lugar,b.puesto&&"Puesto: "+b.puesto,
      importe(b)?"Precio: "+eur(importe(b))+(b.tipoPrecio==="jornada"?" ("+eur(num(b.precio))+"/jornada)":""):"",
      "Estado: "+ESTADOS[ef].label,b.notas&&"Notas: "+b.notas,"Apuntado en Mis Bolos"].filter(Boolean);
    const ev={calendarId:S.ajustes.gcalId,summary:titulo,description:lines.map(esc).join("<br>"),location:b.lugar||"",
      colorId:GC_COLORS[ef]||"10",notificationLevel:"NONE"};
    const fin=finDe(b);
    if(b.hora){
      ev.startTime=b.fecha+"T"+b.hora+":00";
      if(fin>b.fecha) ev.endTime=fin+"T23:59:00";
      else { const [h,m]=b.hora.split(":").map(Number); const tarde=h+8>23; ev.endTime=b.fecha+"T"+(tarde?"23:59":pad(h+8)+":"+pad(m))+":00"; }
    } else { ev.allDay=true; ev.startTime=b.fecha+"T00:00:00"; ev.endTime=this.addDay(fin)+"T00:00:00"; }
    return ev;
  },
  idFrom(p){ if(!p) return ""; if(typeof p==="string"){ const m=p.match(/"id"\s*:\s*"([^"]+)"/); return m?m[1]:""; } return p.id||p.eventId||(p.event&&p.event.id)||""; },
  /* returns the event id to keep on the gig ("" when none) */
  async sync(b){
    if(!this.enabled()) return b.gcalId||"";
    if(b.estado==="cancelado" || b._borrado){
      if(b.gcalId){ try{ await this.call("delete_event",{calendarId:S.ajustes.gcalId,eventId:b.gcalId,notificationLevel:"NONE"}); }catch(e){ if(!e||e.code!=="tool_error") throw e; } }
      return "";
    }
    const ev=this.eventFor(b);
    if(b.gcalId){
      try{ await this.call("update_event",{...ev,eventId:b.gcalId}); return b.gcalId; }
      catch(e){ if(!e||e.code!=="tool_error") throw e; /* the event was removed by hand: create it again */ }
    }
    return this.idFrom(await this.call("create_event",ev));
  },
  /* sync one gig after a save, then remember its event id */
  async after(id,b){
    if(!this.enabled()) return;
    try{
      const gid=await this.sync(b);
      if(!b._borrado && gid!==(b.gcalId||"")){ const cur=S.bolos.get(id); if(cur) await Store.put("bolos",id,{...cur,gcalId:gid}); }
    }catch(e){ toast(this.errText(e)); }
  },
  async syncAll(onProgress){
    const all=bolosArr().filter(b=>b.estado!=="cancelado"||b.gcalId);
    let n=0, fails=0, lastErr=null;
    for(const b of all){
      try{ const gid=await this.sync(b); if(gid!==(b.gcalId||"")){ const cur=S.bolos.get(b.id); if(cur) await Store.put("bolos",b.id,{...cur,gcalId:gid}); } n++; }
      catch(e){ fails++; lastErr=e; if(e&&GC_FATAL.includes(e.code)) break; }
      if(onProgress) onProgress(n,all.length);
    }
    return {n,fails,lastErr,total:all.length};
  }
};

/* ---------- one-tap changes, with undo ---------- */
async function quick(id,accion){
  const b=S.bolos.get(id); if(!b) return;
  const o={...b,actualizado:new Date().toISOString()}; let msg="";
  if(accion==="confirmar"){ o.estado="confirmado"; msg="Bolo confirmado"; }
  else if(accion==="realizado"){ o.estado="realizado"; msg="Marcado como realizado"; }
  else if(accion==="cancelar"){ o.estado="cancelado"; msg="Bolo cancelado"; }
  else if(accion==="cobrado"){ o.pago="pagado"; o.cobrado=importe(b); o.fechaCobro=TODAY; if(o.estado==="confirmado" && finDe(o)<=TODAY) o.estado="realizado"; msg="Marcado como cobrado"; }
  else return;
  if(!(await Store.put("bolos",id,o))) return;
  if(o.estado!==b.estado) GCal.after(id,o);
  toast(msg,async()=>{
    const cur=S.bolos.get(id)||o; const back={...b};
    if("gcalId" in cur) back.gcalId=cur.gcalId;
    if(await Store.put("bolos",id,back)){ toast("Deshecho"); if(back.estado!==o.estado) GCal.after(id,back); }
  });
}
function quickButtons(b){
  const q=[];
  if(b.estado==="posible"||b.estado==="reserva") q.push(["confirmar","Confirmar","ok"]);
  if(activo(b) && b.pago!=="pagado") q.push(["cobrado","Cobrado","ok"]);
  if(b.estado==="confirmado" && b.fecha<=TODAY) q.push(["realizado","Realizado",""]);
  if(b.estado!=="cancelado" && b.estado!=="realizado") q.push(["cancelar","Cancelar bolo","no"]);
  return q;
}
const qbtn = (id,accion,label,cls,close) => `<button class="qbtn ${cls||""}" type="button" data-quick="${id}|${accion}"${close?' data-close="1"':""}>${label}</button>`;

const estadoChip = e => `<span class="chip c-${e.cls}"><i class="dot d-${e.cls}"></i>${e.label}</span>`;
function chipEstado(b){ return estadoChip(ESTADOS[estadoEf(b)]); }

function chipsDeuda(b){

function boloRow(b,opts={}){
  const d=parse(b.fecha); const g=suma(gastosDe(b.id),x=>num(x.importe));
  const otroAnio = opts.showMonth && d.getFullYear()!==today.getFullYear() ? d.getFullYear()+" · " : "";
  const dias = b.fechaFin && b.fechaFin>b.fecha ? " → "+fmtDate(b.fechaFin) : "";
  const sub = otroAnio+([b.empresa,b.lugar].filter(Boolean).join(" · ")||b.puesto||"")+dias+(b.hora?" · "+b.hora:"");
  const debe = deudaDe(b);
  const quickPay = opts.quickPay && debe>0 ? `<button class="mini-btn go" type="button" data-quick="${b.id}|cobrado" aria-label="Marcar como cobrado" title="Marcar como cobrado">${CHECK}</button>` : "";
  return `<div class="rowwrap"><button class="row${b.estado==="cancelado"?" cancel":""}" type="button" data-bolo="${b.id}">
    <div class="datebox"><div class="d">${d.getDate()}</div><div class="w">${UI.mode==="anio"||opts.showMonth?MESES[d.getMonth()].slice(0,3):DIAS[d.getDay()]}</div></div>
    <div class="row-body"><div class="row-title">${esc(b.evento||b.empresa||"Bolo sin nombre")}</div>
      <div class="row-sub">${esc(sub)}</div>
      <div class="chips">${opts.deuda?chipsDeuda(b):chipEstado(b)+chipPago(b)}</div></div>
    <div class="row-amt"><div class="a num">${eur(importe(b))}</div>${g?`<div class="b num">−${eur(g)} gastos</div>`:""}${opts.showPend&&debe>0&&debe<importe(b)?`<div class="b num">faltan ${eur(debe)}</div>`:""}</div>
  </button>${quickPay}</div>`;
}

function calcPeriodo(){
  const bs=bolosArr().filter(b=>inPeriod(b.fecha));
  const act=bs.filter(activo);
  const trabajado=suma(act.filter(hecho),importe), porVenir=suma(act.filter(b=>!hecho(b)),importe);
  const aire=bs.filter(b=>b.estado==="posible"||b.estado==="reserva");
  return {bs,act,trabajado,porVenir,ingresos:trabajado+porVenir,
    cobrado:suma(act,cobradoDe),
    gastos:suma(gastosArr().filter(g=>inPeriod(g.fecha)),g=>num(g.importe)),
    jornadas:suma(act,b=>num(b.jornadas)||1),
    aire,aireImp:suma(aire,importe)};
}

  const l2=[b.hora?"Citación a las "+b.hora:"",b.lugar].filter(Boolean).join(" · ");
  const mapa = b.lugar ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.lugar)}" target="_blank" rel="noopener">Cómo llegar</a>` : "";

      <div class="nexttitle">${esc(b.evento||b.empresa||"Bolo")}</div>
      ${l1?`<div class="nextmeta">${esc(l1)}</div>`:""}${l2?`<div class="nextmeta">${esc(l2)}</div>`:""}

    ${mapa||contacto?`<div class="nextfoot">${mapa}${contacto?`<span class="muted">Contacto: <span class="sel">${esc(contacto)}</span></span>`:""}</div>`:""}

}
function taskHTML(t){
  const b=t.b, id=b.id; let q="", btns="";
  if(t.tipo==="confirmar"){ const d=daysBetween(TODAY,b.fecha); q=(d<=0?"Es hoy":d===1?"Es mañana":"Es en "+d+" días")+" y sigue sin confirmar."; btns=qbtn(id,"confirmar","Confirmado","ok")+qbtn(id,"cancelar","No sale","no"); }
  else { q="Ya pasó la fecha y no estaba confirmado. ¿Lo hiciste?"; btns=qbtn(id,"realizado","Sí, lo hice","ok")+qbtn(id,"cancelar","No salió","no"); }
  return `<div class="task">${boloRow(b,{showMonth:true})}<div class="task-actions"><span class="q">${q}</span>${btns}</div></div>`;

function tablaFuturo(){
  const rows=[];
  for(let i=0;i<6;i++){
    const d=new Date(today.getFullYear(),today.getMonth()+i,1), pre=d.getFullYear()+"-"+pad(d.getMonth()+1);
    const bs=bolosArr().filter(b=>b.fecha.startsWith(pre));
    const conf=suma(bs.filter(activo),importe), aire=suma(bs.filter(b=>b.estado==="posible"||b.estado==="reserva"),importe);
    if(conf||aire) rows.push({pre,label:cap(MESES[d.getMonth()])+(d.getFullYear()!==today.getFullYear()?" "+d.getFullYear():""),conf,aire});
  }
  if(!rows.length || (rows.length===1 && periodoActual() && rows[0].pre===TODAY.slice(0,7))) return "";
  return `<h2>Lo que viene, mes a mes</h2><div class="card tblwrap"><table class="tbl"><thead><tr><th>Mes</th><th>Confirmado</th><th>Sin confirmar</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><button class="linkbtn" type="button" data-ym="${r.pre}">${r.label}</button></td><td><strong>${r.conf?eur(r.conf):"—"}</strong></td><td class="dim">${r.aire?eur(r.aire):"—"}</td></tr>`).join("")}
    <tr class="tot"><td>Total</td><td>${eur(suma(rows,r=>r.conf))}</td><td class="dim">${eur(suma(rows,r=>r.aire))}</td></tr></tbody></table></div>`;
}
function tablaMeses(){
  const rows=[];
  for(let m=0;m<12;m++){
    const pre=UI.y+"-"+pad(m+1);
    const ing=suma(bolosArr().filter(b=>activo(b)&&b.fecha.startsWith(pre)),importe);
    const gas=suma(gastosArr().filter(g=>g.fecha.startsWith(pre)),g=>num(g.importe));
    if(ing||gas) rows.push({pre,m,ing,gas});
  }
  if(!rows.length) return "";
  const tI=suma(rows,r=>r.ing), tG=suma(rows,r=>r.gas);
  return `<h2>Mes a mes</h2><div class="card tblwrap"><table class="tbl"><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Te queda</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><button class="linkbtn" type="button" data-ym="${r.pre}">${cap(MESES[r.m])}</button></td><td>${eur(r.ing)}</td><td class="dim">${r.gas?"−"+eur(r.gas):"—"}</td><td><strong>${eur(r.ing-r.gas)}</strong></td></tr>`).join("")}
    <tr class="tot"><td>Total</td><td>${eur(tI)}</td><td>${tG?"−"+eur(tG):"—"}</td><td>${eur(tI-tG)}</td></tr></tbody></table></div>`;
}
function vResumen(){
  const A=S.ajustes, P=calcPeriodo(), pasado=periodoPasado();
  const queda=P.ingresos-P.gastos;
  let h="";
  if(!S.bolos.size && !S.gastos.size){
    h+=`<div class="empty" style="margin-bottom:16px"><strong>Apunta tu primer bolo</strong>Pulsa «Nuevo bolo»: con la empresa, la fecha y el precio ya vale. Aquí verás lo que vas a ganar, lo que te deben y lo que tienes pendiente.</div>`;
  }

  /* next gig */
  const futuros=bolosArr().filter(b=>finDe(b)>=TODAY && b.estado!=="cancelado").sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const prox=futuros.find(b=>b.estado!=="posible");
  if(prox) h+=`<h2>Tu próximo bolo</h2>${proximoCard(prox)}`;

  /* the selected month or year */
  h+=`<h2>${esc(periodLabel())}</h2><div class="card hero">
    <div class="hero-main"><div><div class="cap">${pasado?"Ganaste":"Vas a ganar"}</div><div class="big">${eur(P.ingresos)}</div></div>
      <div class="small muted">${plural(P.act.length,"bolo","bolos")} · ${fmtN(P.jornadas)} ${P.jornadas===1?"jornada":"jornadas"}</div></div>
    <div class="ledger">
      ${pasado?"":`<div><span>Ya trabajado</span><span class="num">${eur(P.trabajado)}</span></div><div><span>Confirmado por hacer</span><span class="num">${eur(P.porVenir)}</span></div>`}
      <div><span>Gastos</span><span class="num${P.gastos?" neg":""}">${P.gastos?"−":""}${eur(P.gastos)}</span></div>
      <div><strong>Te queda</strong><span class="num"><strong>${eur(queda)}</strong></span></div>
    </div>
    <div class="ledger sub">
      <div><span>De eso, ya cobrado</span><span class="num pos">${eur(P.cobrado)}</span></div>
      <div><span>Media por jornada</span><span class="num">${P.jornadas?eur(P.ingresos/P.jornadas):"—"}</span></div>
      ${P.aire.length?`<div><span>Sin confirmar (${plural(P.aire.length,"bolo","bolos")})</span><span class="num">${eur(P.aireImp)}</span></div>`:""}
    </div>
  </div>`;

  /* money owed, all dates */
  const deben=bolosArr().filter(b=>deudaDe(b)>0).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  h+=`<h2>Te deben</h2>`;
  if(!deben.length) h+=`<div class="empty">Nada pendiente. Todo lo que has trabajado está cobrado.</div>`;
  else {
    const tarde=deben.filter(atrasado), porEmp=new Map();
    deben.forEach(b=>{ const k=b.empresa||"Sin empresa"; porEmp.set(k,(porEmp.get(k)||0)+deudaDe(b)); });
    h+=`<div class="card hero">
      <div class="hero-main"><div><div class="cap">Trabajo hecho y sin cobrar</div><div class="big">${eur(suma(deben,deudaDe))}</div></div><div class="small muted">${plural(deben.length,"bolo","bolos")}</div></div>
      ${tarde.length?`<div class="debt-late">${eur(suma(tarde,deudaDe))} ya tendrían que estar pagados (${plural(tarde.length,"bolo","bolos")}).</div>`:""}
      ${porEmp.size>1?`<div class="ledger">${[...porEmp.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><span>${esc(k)}</span><span class="num">${eur(v)}</span></div>`).join("")}</div>`:""}
    </div>
    <div class="stack" style="margin-top:8px">${deben.map(b=>boloRow(b,{quickPay:true,showMonth:true,showPend:true,deuda:true})).join("")}</div>
    <p class="hint" style="margin:8px 4px 0">Pulsa ✓ cuando te paguen un bolo.</p>`;
  }

  /* decisions waiting */
  const ts=tareas();
  if(ts.length){
    h+=`<h2>Por hacer</h2><div class="stack">${ts.slice(0,8).map(taskHTML).join("")}</div>`;
    if(ts.length>8) h+=`<p class="hint" style="margin:8px 4px 0">Y ${ts.length-8} más. Irán apareciendo según resuelvas estos.</p>`;
  }

  /* upcoming */
  const resto=futuros.filter(b=>!prox||b.id!==prox.id).slice(0,6), conf=conflictos();
  if(resto.length||conf.length){
    h+=`<h2>${prox?"Después":"Próximos bolos"}</h2>`;
    if(conf.length) h+=`<div class="banner warn">Ojo, se te solapan: ${conf.map(([a,b])=>esc(fmtDate(a.fecha)+" ("+(a.evento||a.empresa)+" y "+(b.evento||b.empresa)+")")).join("; ")}.</div>`;
    if(resto.length) h+=`<div class="stack">${resto.map(b=>boloRow(b,{showMonth:true})).join("")}</div>`;
  }
  h+=tablaFuturo();
  if(UI.mode==="anio") h+=tablaMeses();

  /* who gave work in the period */
  const porEmpP=new Map();
  P.act.forEach(b=>{ const k=b.empresa||"Sin empresa"; porEmpP.set(k,(porEmpP.get(k)||0)+importe(b)); });
  if(porEmpP.size){
    const max=Math.max(...porEmpP.values());
    h+=`<h2>Quién te ha dado trabajo en ${esc(periodoTexto())}</h2><div class="card" style="padding:4px 14px 10px">${[...porEmpP.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      `<div style="padding:10px 0 0"><div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(k)}</span><span class="num">${eur(v)}</span></div><div class="bar"><i style="width:${max?Math.round(v/max*100):0}%"></i></div></div>`).join("")}</div>`;
  }
  return h;
}

function bolosBody(){
  if(UI.q.trim()){

    const bs=bolosArr().filter(b=>norm([b.evento,b.empresa,b.lugar,b.puesto,b.notas].join(" ")).includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!bs.length) return `<div class="empty"><strong>Sin resultados</strong>No hay ningún bolo con «${esc(UI.q.trim())}».</div>`;
    return `<p class="small muted" style="margin:0 4px 10px">${plural(bs.length,"resultado","resultados")} en todas las fechas</p><div class="stack">${bs.slice(0,100).map(b=>boloRow(b,{showMonth:true})).join("")}</div>`;
  }
  let h=`<div class="toolbar"><div class="seg" role="group" aria-label="Vista">
    <button type="button" data-bview="lista" aria-pressed="${UI.bolosView==="lista"}">Lista</button>
    <button type="button" data-bview="cal" aria-pressed="${UI.bolosView==="cal"}"${UI.mode==="anio"?" disabled":""}>Calendario</button></div></div>`;
  let bs = bolosArr().filter(b=>inPeriod(b.fecha)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(UI.bolosView==="cal" && UI.mode==="mes"){
    h+=calendar();
    if(UI.dia){
      const dd = bolosArr().filter(b=>b.fecha<=UI.dia && finDe(b)>=UI.dia);
      h+=`<h2>${esc(DIAS[parse(UI.dia).getDay()]+" "+fmtDate(UI.dia))}</h2>${dd.length?`<div class="stack">${dd.map(b=>boloRow(b)).join("")}</div>`:'<div class="empty">Día libre.</div>'}
        <div class="actions" style="margin-top:10px"><button class="btn" type="button" data-nuevo-dia="${UI.dia}">Añadir bolo este día</button></div>`;
    } else h+='<p class="hint">Toca un día para ver sus bolos o apuntar uno nuevo.</p>';
    return h;
  }
  const filtros=[["todos","Todos"],["confirmado","Confirmados"],["reserva","En reserva"],["posible","Posibles"],["realizado","Realizados"],["sincobrar","Sin cobrar"],["cancelado","Cancelados"]];
  h+=`<div class="filters" role="group" aria-label="Filtrar">${filtros.map(([k,l])=>`<button type="button" data-filtro="${k}" aria-pressed="${UI.filtro===k}">${l}</button>`).join("")}</div>`;
  if(UI.filtro==="sincobrar") bs=bs.filter(b=>deudaDe(b)>0);
  else if(UI.filtro!=="todos") bs=bs.filter(b=>estadoEf(b)===UI.filtro);
  if(!bs.length) return h+'<div class="empty"><strong>No hay bolos aquí</strong>Cambia de mes o de filtro, o pulsa «Nuevo bolo».</div>';
  h+=`<p class="small muted" style="margin:0 4px 10px">${plural(bs.length,"bolo","bolos")} · confirmados y realizados suman <span class="num">${eur(suma(bs.filter(activo),importe))}</span></p>`;
  if(UI.mode==="anio"){
    const groups=new Map(); bs.forEach(b=>{ const k=b.fecha.slice(0,7); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(b); });
    groups.forEach((arr,k)=>{ h+=`<h2>${cap(MESES[Number(k.slice(5))-1])} · <span class="num">${eur(suma(arr.filter(activo),importe))}</span></h2><div class="stack">${arr.map(b=>boloRow(b)).join("")}</div>`; });
  } else h+=`<div class="stack">${bs.map(b=>boloRow(b)).join("")}</div>`;
  return h;
}
function calendar(){
  const first=new Date(UI.y,UI.m,1), startDow=(first.getDay()+6)%7, n=new Date(UI.y,UI.m+1,0).getDate(), all=bolosArr();
  let h='<div class="card cal">'+["L","M","X","J","V","S","D"].map(d=>'<div class="hd">'+d+'</div>').join("");
  for(let i=0;i<startDow;i++) h+='<button class="out" type="button" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1; d<=n; d++){
    const ds=UI.y+"-"+pad(UI.m+1)+"-"+pad(d);
    const on=all.filter(b=>b.fecha<=ds && finDe(b)>=ds);
    h+=`<button type="button" data-dia="${ds}" class="${ds===TODAY?"today ":""}${ds===UI.dia?"sel":""}" aria-label="${d} de ${MESES[UI.m]}${on.length?", "+plural(on.length,"bolo","bolos"):""}">${d}<span class="dots">${on.slice(0,4).map(b=>`<i class="dot d-${ESTADOS[estadoEf(b)].cls}"></i>`).join("")}</span></button>`;

  return h+'</div><div class="legend">'+Object.values(ESTADOS).map(estadoChip).join("")+'</div>';
}

    <div class="two"><div class="field"><label for="b-fecha">Fecha</label><input id="b-fecha" type="date" name="fecha" required value="${esc(b.fecha)}"></div>
      <div class="field"><label for="b-fin">Hasta (si son varios días)</label><input id="b-fin" type="date" name="fechaFin" value="${esc(b.fechaFin)}"></div></div>
    <div class="field"><label for="b-lugar">Lugar</label><input id="b-lugar" name="lugar" list="dl-lug" value="${esc(b.lugar)}" placeholder="Sala, teatro, recinto, ciudad"></div>${datalist("dl-lug",lugares())}
    <div class="two"><div class="field"><label for="b-hora">Hora de citación</label><input id="b-hora" type="time" name="hora" value="${esc(b.hora)}"></div>
      <div class="field"><label for="b-jornadas">Jornadas</label><input id="b-jornadas" type="number" inputmode="decimal" step="0.5" min="0" name="jornadas" value="${esc(b.jornadas)}"></div></div>
    <div class="two"><div class="field"><label for="b-precio">Precio pactado (€)</label><input id="b-precio" type="number" inputmode="decimal" step="0.01" min="0" name="precio" value="${esc(b.precio)}"></div>
      <div class="field"><label for="b-tipo">Ese precio es</label><select id="b-tipo" name="tipoPrecio">${opt("total","Por todo el bolo",b.tipoPrecio)}${opt("jornada","Por jornada",b.tipoPrecio)}</select></div></div>
    <div class="calc" id="b-calc"></div>
    <div class="field"><span class="lbl">Estado</span><div class="radios" id="b-estado">${radios}</div></div>
    <details class="more"${cobroAbierto?" open":""}><summary>Cobro</summary><div class="fields">
      <div class="two"><div class="field"><label for="b-pago">¿Te lo han pagado?</label><select id="b-pago" name="pago">${Object.entries(PAGOS).map(([k,l])=>opt(k,l,b.pago||"pendiente")).join("")}</select></div>
        <div class="field"><label for="b-fcobro">Fecha de cobro</label><input id="b-fcobro" type="date" name="fechaCobro" value="${esc(b.fechaCobro)}"></div></div>
      <div class="field" id="b-cobrado-wrap"><label for="b-cobrado">Cuánto te han pagado ya (€)</label><input id="b-cobrado" type="number" inputmode="decimal" step="0.01" min="0" name="cobrado" value="${esc(b.cobrado)}"></div>
    </div></details>
    <details class="more"${masAbierto?" open":""}><summary>Puesto, extras y notas</summary><div class="fields">
      <div class="field"><label for="b-puesto">Tu puesto</label><input id="b-puesto" name="puesto" list="dl-puesto" value="${esc(b.puesto)}" placeholder="Técnico de iluminación"></div>${datalist("dl-puesto",PUESTOS)}
      <div class="two"><div class="field"><label for="b-extras">Extras (€)</label><input id="b-extras" type="number" inputmode="decimal" step="0.01" min="0" name="extras" value="${esc(b.extras||"")}"></div>
        <div class="field"><label for="b-extrasnota">De qué son</label><input id="b-extrasnota" name="extrasNota" value="${esc(b.extrasNota)}" placeholder="Horas extra, dietas…"></div></div>
      <span class="hint">Los extras se suman al precio pactado: horas extra, dietas o kilometraje que te paga la empresa.</span>
      <div class="field"><label for="b-notas">Notas</label><textarea id="b-notas" name="notas" placeholder="Contacto en el bolo, material, horarios…">${esc(b.notas)}</textarea></div>
    </div></details>
    ${id?`<div class="field"><span class="lbl">Gastos de este bolo · <span class="num">${eur(gtot)}</span> · te deja <span class="num">${eur(importe(b)-gtot)}</span></span>
      ${gs.length?`<div class="stack" style="border:1px solid var(--line)">${gs.map(g=>`<button class="row" type="button" data-gasto="${g.id}" style="padding:10px 12px"><div class="row-body"><div class="row-title">${esc(g.concepto||CATS[g.categoria]||"Gasto")}</div><div class="row-sub">${esc(fmtDate(g.fecha)+" · "+(CATS[g.categoria]||""))}</div></div><div class="row-amt"><div class="a num">${eur(num(g.importe))}</div></div></button>`).join("")}</div>`:""}
      <button class="btn" type="button" id="b-addgasto">Añadir gasto a este bolo</button></div>`:""}
    <div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="b-cancel">Cancelar</button></div>
    ${id?`<div class="actions"><button class="btn" type="button" id="b-dup">Duplicar</button><button class="btn danger" type="button" id="b-del">Borrar</button></div>`:""}
  </form>`;
  openSheet(html,root=>{
    const f=root.querySelector("#f-bolo");
    const paintRadios=()=>root.querySelectorAll(".radios input").forEach(i=>i.nextElementSibling.classList.toggle("on",i.checked));
    const calc=()=>{
      const tot=importe({precio:f.precio.value,tipoPrecio:f.tipoPrecio.value,jornadas:f.jornadas.value,extras:f.extras.value});
      root.querySelector("#b-calc").innerHTML=`<span class="muted">Total del bolo</span><span class="num"><strong>${eur(tot)}</strong></span>`;
      root.querySelector("#b-cobrado-wrap").hidden = f.pago.value!=="parcial";
    };
    const syncDays=()=>{ if(f.fechaFin.value && f.fecha.value && f.fechaFin.value>=f.fecha.value && (nuevo || num(b.jornadas)<=1)){ f.jornadas.value=daysBetween(f.fecha.value,f.fechaFin.value)+1; calc(); } };
    paintRadios(); calc();
    root.querySelector("#b-estado").addEventListener("change",paintRadios);
    ["precio","tipoPrecio","jornadas","extras","pago"].forEach(n=>f[n].addEventListener("input",calc));
    f.pago.addEventListener("change",()=>{ if(f.pago.value==="pagado" && !f.fechaCobro.value) f.fechaCobro.value=TODAY; calc(); });
    f.fechaFin.addEventListener("change",syncDays);
    /* a new gig for a known company starts from what was agreed last time */
    if(nuevo) f.empresa.addEventListener("change",()=>{
      const u=ultimoDe(f.empresa.value), hint=root.querySelector("#b-emp-hint");
      if(!u){ hint.hidden=true; return; }
      const usados=[];
      if(!f.precio.value){ f.precio.value=num(u.precio); f.tipoPrecio.value=u.tipoPrecio==="jornada"?"jornada":"total"; usados.push(eur(num(u.precio))+(u.tipoPrecio==="jornada"?" por jornada":" por bolo")); }
      if(!f.puesto.value && u.puesto){ f.puesto.value=u.puesto; usados.push(u.puesto); }
      if(usados.length){ hint.textContent="Como la última vez con "+u.empresa+": "+usados.join(", ")+". Cámbialo si esta vez es distinto."; hint.hidden=false; }
      calc();
    });
    root.querySelector("#b-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f); const o={};
      ["evento","empresa","fecha","fechaFin","hora","lugar","puesto","tipoPrecio","pago","fechaCobro","notas","estado","extrasNota"].forEach(k=>o[k]=String(fd.get(k)||"").trim());
      o.precio=num(fd.get("precio")); o.jornadas=num(fd.get("jornadas"))||1; o.cobrado=num(fd.get("cobrado")); o.extras=num(fd.get("extras"));
      if(!o.fecha){ toast("Pon la fecha del bolo"); return; }
      if(!o.evento && !o.empresa){ toast("Pon al menos el evento o la empresa"); f.evento.focus(); return; }
      if(!ESTADOS[o.estado]) o.estado="confirmado";
      if(o.fechaFin && o.fechaFin<o.fecha) o.fechaFin="";
      if(o.pago!=="parcial") o.cobrado = o.pago==="pagado" ? importe(o) : 0;
      if(o.estado==="confirmado" && finDe(o)<TODAY && o.pago==="pagado") o.estado="realizado";
      o.actualizado=new Date().toISOString(); o.creado = id ? (b.creado||o.actualizado) : o.actualizado;
      if(id && b.gcalId) o.gcalId=b.gcalId;
      const bid=id||newId();
      if(await Store.put("bolos",bid,o)){ closeSheet(); toast(id?"Bolo guardado":"Bolo apuntado"); GCal.after(bid,o); }
    });
    if(id){
      root.querySelector("#b-addgasto").addEventListener("click",()=>gastoForm(null,{boloId:id,fecha:b.fecha,lugar:b.lugar}));
      root.querySelector("#b-dup").addEventListener("click",()=>{ const c={...b}; ["id","gcalId","fechaCobro","creado","actualizado"].forEach(k=>delete c[k]); c.pago="pendiente"; c.cobrado=0; c.estado="confirmado"; boloForm(null,c); toast("Copia lista: cambia la fecha y guarda"); });
      armDelete(root.querySelector("#b-del"),async()=>{ if(await Store.del("bolos",id)){ closeSheet(); toast("Bolo borrado"); if(b.gcalId) GCal.after(id,{...b,_borrado:true}); } });
    }
  });
}

  const bs = bolosArr().filter(b=>b.estado!=="cancelado" || b.id===g.boloId).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,120);
  const html=`<h3>${id?"Editar gasto":"Nuevo gasto"}</h3><form id="f-gasto" autocomplete="off">
    <div class="field"><label for="g-concepto">Concepto</label><input id="g-concepto" name="concepto" value="${esc(g.concepto)}" placeholder="Gasolina ida y vuelta, comida, guantes…"></div>
    <div class="two"><div class="field"><label for="g-cat">Tipo</label><select id="g-cat" name="categoria">${Object.entries(CATS).map(([k,l])=>opt(k,l,g.categoria)).join("")}</select></div>
      <div class="field"><label for="g-fecha">Fecha</label><input id="g-fecha" type="date" name="fecha" required value="${esc(g.fecha)}"></div></div>
    <div class="field" id="g-km-wrap"><label for="g-km">Kilómetros</label><input id="g-km" type="number" inputmode="decimal" step="1" min="0" name="km" value="${esc(g.km||"")}"><span class="hint" id="g-km-hint"></span></div>
    <div class="field"><label for="g-importe">Importe (€)</label><input id="g-importe" type="number" inputmode="decimal" step="0.01" min="0" name="importe" required value="${esc(g.importe)}"></div>
    <div class="field"><label for="g-bolo">¿De qué bolo?</label><select id="g-bolo" name="boloId">${opt("","Ninguno (gasto general)",g.boloId||"")}${bs.map(b=>opt(b.id,fmtDate(b.fecha)+" "+b.fecha.slice(0,4)+" · "+(b.evento||b.empresa||"Bolo"),g.boloId)).join("")}</select></div>
    <div class="field"><label for="g-lugar">Lugar</label><input id="g-lugar" name="lugar" list="dl-lug2" value="${esc(g.lugar)}" placeholder="Dónde fue el gasto"></div>${datalist("dl-lug2",lugares())}
    <div class="field"><label for="g-notas">Notas</label><textarea id="g-notas" name="notas" placeholder="¿Tienes el tique? ¿Lo paga la empresa?">${esc(g.notas)}</textarea></div>
    <div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="g-cancel">Cancelar</button></div>
    ${id?'<div class="actions"><button class="btn danger" type="button" id="g-del">Borrar</button></div>':""}
  </form>`;
  openSheet(html,root=>{
    const f=root.querySelector("#f-gasto");
    const kmSync=(fromKm)=>{
      const isKm=f.categoria.value==="km"; root.querySelector("#g-km-wrap").hidden=!isKm;
      const rate=num(S.ajustes.km)||0.26;
      root.querySelector("#g-km-hint").textContent="A "+String(rate).replace(".",",")+" €/km (cámbialo en Ajustes)";
      if(isKm && fromKm) f.importe.value=(num(f.km.value)*rate).toFixed(2);
    };
    kmSync(false);
    f.categoria.addEventListener("change",()=>kmSync(true));
    f.km.addEventListener("input",()=>kmSync(true));
    f.boloId.addEventListener("change",()=>{ const b=S.bolos.get(f.boloId.value); if(b && !f.lugar.value) f.lugar.value=b.lugar||""; });
    root.querySelector("#g-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f); const o={};
      ["concepto","categoria","fecha","boloId","lugar","notas"].forEach(k=>o[k]=String(fd.get(k)||"").trim());
      o.importe=num(fd.get("importe")); o.km=o.categoria==="km"?num(fd.get("km")):0;
      if(!o.fecha){ toast("Pon la fecha del gasto"); return; }

      o.actualizado=new Date().toISOString();
      if(await Store.put("gastos",id||newId(),o)){ closeSheet(); toast(id?"Gasto guardado":"Gasto apuntado"); }
    });
    if(id) armDelete(root.querySelector("#g-del"),async()=>{ if(await Store.del("gastos",id)){ closeSheet(); toast("Gasto borrado"); } });
  });
}

function ajustesForm(){
  const A=S.ajustes;
  const html=`<h3>Ajustes</h3><form id="f-aj">

    <div class="actions"><button class="btn primary" type="submit">Guardar ajustes</button></div></form>
    <h2>Google Calendar</h2>
    <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)">
      <p class="small" style="margin:0">Tus bolos se apuntan en un calendario aparte de Google Calendar, sin tocar tus otros calendarios. Los cancelados se quitan solos.</p>
      <div class="field"><label for="gc-nombre">Nombre del calendario en Google</label><input id="gc-nombre" value="${esc(A.gcalNombre||"Mis Bolos")}"></div>
      <div id="gc-estado" class="small"></div>

      ${A.gcalId?`<label class="switch" style="background:var(--surface)"><span>Sincronizar al guardar</span><input type="checkbox" id="gc-on"${A.gcalOn?" checked":""}></label>`:""}
    </div>
    <h2>Tus datos</h2><p class="small muted" style="margin-top:0">${S.storeKind==="nube"?"Se guardan en tu cuenta de Claude y los ves igual en el móvil y en el ordenador.":"Se guardan solo en este dispositivo. Descarga una copia de vez en cuando."}</p>
    <div class="actions"><button class="btn" type="button" id="x-csv-b">Exportar bolos (CSV)</button><button class="btn" type="button" id="x-csv-g">Exportar gastos (CSV)</button></div>
    <div class="actions"><button class="btn" type="button" id="x-json">Descargar copia completa</button><button class="btn" type="button" id="x-import">Restaurar copia</button></div>

      if(await Store.put("ajustes","general",o)){ closeSheet(); toast("Ajustes guardados"); }
    });
    const gcEstado=root.querySelector("#gc-estado");
    const paintGc=()=>{ gcEstado.innerHTML = S.ajustes.gcalId
        ? (S.ajustes.gcalOn?'<span class="chip c-ok"><i class="dot d-ok"></i>Activado</span> ':'<span class="chip c-plain">En pausa</span> ')+'Usando el calendario «'+esc(S.ajustes.gcalNombre)+'».'
        : '<span class="muted">Aún sin activar.</span>'; };
    paintGc();

      const btn=ev.currentTarget, nombre=root.querySelector("#gc-nombre").value.trim()||"Mis Bolos";

      try{
        const cid=await GCal.findCalendar(nombre);

        const na={...S.ajustes,gcalId:cid,gcalNombre:nombre,gcalOn:true};
        if(await Store.put("ajustes","general",na)){ S.ajustes=na; toast("Calendario conectado"); ajustesForm(); }

    });
    const gcOn=root.querySelector("#gc-on");
    if(gcOn) gcOn.addEventListener("change",async()=>{ const na={...S.ajustes,gcalOn:gcOn.checked}; if(await Store.put("ajustes","general",na)){ S.ajustes=na; paintGc(); toast(na.gcalOn?"Sincronización activada":"Sincronización en pausa"); } });

      gcEstado.innerHTML = r.fails ? '<span class="chip c-warn">'+r.n+' de '+r.total+'</span> '+esc(GCal.errText(r.lastErr)) : '<span class="chip c-ok"><i class="dot d-ok"></i>Hecho</span> '+plural(r.n,"bolo","bolos")+' al día en «'+esc(S.ajustes.gcalNombre)+'».';
    });
    root.querySelector("#x-csv-b").addEventListener("click",()=>exportCSV("bolos"));
    root.querySelector("#x-csv-g").addEventListener("click",()=>exportCSV("gastos"));
    root.querySelector("#x-json").addEventListener("click",exportJSON);
    root.querySelector("#x-import").addEventListener("click",()=>$("#import-file").click());
  });
}

/* ---------- export / import ---------- */
async function saveFile(filename,data){
  let dl=null; try{ dl = window.claude && await window.claude.use("downloads"); }catch(e){}
  if(!dl){ toast("Descargar no está disponible en esta vista"); return; }
  try{ const r=await dl.save({filename,data}); if(r && r.status==="saved") toast("Archivo guardado"); }
  catch(e){ if(e && e.code!=="cancelled" && e.code!=="declined") toast("No se pudo guardar el archivo"); }
}
const csvCell = v => { const s=String(v==null?"":v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const dec = n => String(Math.round((n||0)*100)/100).replace(".",",");
function exportCSV(kind){
  let rows;
  if(kind==="bolos"){
    rows=[["Fecha","Hasta","Evento","Empresa","Lugar","Puesto","Jornadas","Precio pactado","Extras","Total","Estado","Cobro","Cobrado","Te deben","Fecha cobro","Gastos asociados","Te deja","Notas"]];
    bolosArr().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(b=>{ const g=suma(gastosDe(b.id),x=>num(x.importe));
      rows.push([b.fecha,b.fechaFin,b.evento,b.empresa,b.lugar,b.puesto,dec(num(b.jornadas)||1),dec(baseDe(b)),dec(num(b.extras)),dec(importe(b)),ESTADOS[estadoEf(b)].label,PAGOS[b.pago]||"",dec(cobradoDe(b)),dec(deudaDe(b)),b.fechaCobro,dec(g),dec(importe(b)-g),b.notas]); });
  } else {
    rows=[["Fecha","Concepto","Tipo","Importe","Km","Bolo","Lugar","Notas"]];
    gastosArr().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(g=>{ const b=g.boloId?S.bolos.get(g.boloId):null;
      rows.push([g.fecha,g.concepto,CATS[g.categoria]||"",dec(num(g.importe)),g.km||"",b?(b.evento||b.empresa):"",g.lugar,g.notas]); });
  }
  saveFile(kind+"-"+TODAY+".csv","﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"));
}
function exportJSON(){
  saveFile("mis-bolos-copia-"+TODAY+".json",JSON.stringify({app:"mis-bolos",version:1,fecha:TODAY,bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes},null,1));
}
$("#import-file").addEventListener("change",async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const o=JSON.parse(await file.text());
    if(o.app!=="mis-bolos") throw new Error("formato");
    let n=0;
    for(const col of ["bolos","gastos","empresas"]) for(const [id,d] of Object.entries(o[col]||{})){ if(/^[A-Za-z0-9_.~:@+-]+$/.test(id) && d && typeof d==="object"){ await Store.put(col,id,d); n++; } }
    if(o.ajustes) await Store.put("ajustes","general",{...DEF_AJUSTES,...o.ajustes});
    closeSheet(); toast(n+" registros restaurados");
  }catch(err){ toast("Ese archivo no es una copia de Mis Bolos"); }
});

/* ---------- events ---------- */
function setTab(t){ UI.tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); window.scrollTo(0,0); }
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#mode-mes").addEventListener("click",()=>{ UI.mode="mes"; render(); });
$("#mode-anio").addEventListener("click",()=>{ UI.mode="anio"; UI.dia=null; render(); });
function shift(d){ if(UI.mode==="anio") UI.y+=d; else { UI.m+=d; if(UI.m<0){UI.m=11;UI.y--;} if(UI.m>11){UI.m=0;UI.y++;} } UI.dia=null; render(); }
$("#prev").addEventListener("click",()=>shift(-1));
$("#next").addEventListener("click",()=>shift(1));
$("#hoy").addEventListener("click",()=>{ UI.y=today.getFullYear(); UI.m=today.getMonth(); UI.dia=null; render(); });
$("#btn-ajustes").addEventListener("click",ajustesForm);
function pintaOjo(){ const b=$("#btn-ojo"); b.innerHTML=OCULTO?OJO_CERRADO:OJO_ABIERTO; b.setAttribute("aria-pressed",OCULTO?"true":"false"); b.setAttribute("aria-label",OCULTO?"Mostrar cantidades":"Ocultar cantidades"); }
$("#btn-ojo").addEventListener("click",()=>{ OCULTO=!OCULTO; try{ localStorage.setItem("mis-bolos-ocultar",OCULTO?"1":"0"); }catch(e){} pintaOjo(); render(); });
pintaOjo();
$("#fab").addEventListener("click",()=>{
  const fueraDeHoy = UI.mode==="mes" && !inPeriod(TODAY) ? {fecha:UI.y+"-"+pad(UI.m+1)+"-01"} : null;
  if(UI.tab==="gastos") gastoForm(null,fueraDeHoy);
  else boloForm(null, UI.dia ? {fecha:UI.dia} : fueraDeHoy);
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  UI.q=e.target.value; const el=$("#bolos-body"); if(el) el.innerHTML=bolosBody();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-quick],[data-bolo],[data-gasto],[data-empresa],[data-filtro],[data-bview],[data-dia],[data-nuevo-dia],[data-ym]");
  if(!t) return;
  const d=t.dataset;
  if(d.quick){ const [id,accion]=d.quick.split("|"); t.disabled=true; if(d.close || !$("#sheet").hidden) closeSheet(); quick(id,accion); return; }
  if(d.bolo) return boloForm(d.bolo);
  if(d.gasto) return gastoForm(d.gasto);
  if(d.empresa) return empresaForm(d.empresa,d.nombre);
  if(d.filtro){ UI.filtro=d.filtro; return render(); }
  if(d.bview){ UI.bolosView=d.bview; return render(); }
  if(d.dia){ UI.dia = UI.dia===d.dia ? null : d.dia; return render(); }
  if(d.nuevoDia) return boloForm(null,{fecha:d.nuevoDia});
  if(d.ym){ UI.mode="mes"; UI.y=Number(d.ym.slice(0,4)); UI.m=Number(d.ym.slice(5,7))-1; UI.dia=null; render(); window.scrollTo(0,0); }
});
function fromHash(){ const h=(location.hash||"").slice(1); if(["resumen","bolos","gastos","empresas"].includes(h)) UI.tab=h; }
window.addEventListener("hashchange",()=>{ fromHash(); render(); });
fromHash();
render();
Store.init();
})();
</script>
