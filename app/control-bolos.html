<title>Mis Bolos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1d1a17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column. Sticky header with the period, content cards, fixed bottom tab bar, bottom-sheet forms.
   Palette: tungsten amber accent; theatre-gel colours for gig status. */
:root{
  --bg:#f5f3ef; --surface:#ffffff; --surface-2:#ece8e1; --fg:#1f1c18; --muted:#6b6458; --line:#dcd5c9;
  --accent:#b8650f; --accent-fg:#ffffff; --accent-soft:#f6e6d2;
  --ok:#23784a; --ok-bg:#dff0e5; --warn:#94600e; --warn-bg:#f8ead0; --bad:#b23a32; --bad-bg:#f6dfdc;
  --info:#2d5f9e; --info-bg:#dde8f6; --idea:#6a4ca3; --idea-bg:#e9e2f5;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 4px 16px rgba(40,30,20,.06);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141210; --surface:#1d1a17; --surface-2:#28241f; --fg:#f2ede5; --muted:#a69d8f; --line:#383229;
  --accent:#f0a540; --accent-fg:#1d1408; --accent-soft:#3a2a15;
  --ok:#73c991; --ok-bg:#1d3326; --warn:#ecb558; --warn-bg:#3a2d16; --bad:#f0857a; --bad-bg:#3d201d;
  --info:#88b0ea; --info-bg:#1d2a3d; --idea:#b9a0ea; --idea-bg:#2c2440;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1d1a17; --surface-2:#28241f; --fg:#f2ede5; --muted:#a69d8f; --line:#383229;
  --accent:#f0a540; --accent-fg:#1d1408; --accent-soft:#3a2a15;
  --ok:#73c991; --ok-bg:#1d3326; --warn:#ecb558; --warn-bg:#3a2d16; --bad:#f0857a; --bad-bg:#3d201d;
  --info:#88b0ea; --info-bg:#1d2a3d; --idea:#b9a0ea; --idea-bg:#2c2440;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar-h) + 88px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;
  display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.brand .lamp{width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px;stroke:var(--fg)}
.period{display:flex;align-items:center;gap:6px}
.period .label{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:20px;text-transform:capitalize}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* status banner */
.banner{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

/* generic */
h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
h2:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:15px}
.empty strong{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}

/* KPI */
.hero{padding:16px;display:flex;flex-direction:column;gap:14px}
.hero-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hero-main .big{font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1}
.hero-main .cap{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-num);font-weight:600;font-size:19px;margin-top:2px;overflow-wrap:anywhere}
.kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--bad)}
.tax{display:flex;flex-direction:column;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:12px}
.tax div{display:flex;justify-content:space-between;gap:12px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* rows */
.row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-align:left;width:100%}
.row.cancel{opacity:.6}
.rowwrap{display:flex;gap:8px;align-items:center}
.rowwrap>.row{flex:1;min-width:0;width:auto}
.datebox{flex:none;width:48px;text-align:center;border-radius:10px;background:var(--surface-2);padding:6px 0}
.datebox .d{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1}
.datebox .w{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row-body{flex:1;min-width:0}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{flex:none;text-align:right}
.row-amt .a{font-family:var(--f-num);font-weight:600}
.row-amt .b{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)}
.c-idea{background:var(--idea-bg);color:var(--idea)} .c-plain{background:var(--surface-2);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-info{background:var(--info)} .d-idea{background:var(--idea)}
.mini-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;flex:none}
.mini-btn.go{background:var(--ok-bg);color:var(--ok);border-color:transparent}

.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:10px}
.cal .hd{font-size:11px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cal button{aspect-ratio:1/1.05;max-width:100%;border:0;border-radius:8px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px 2px;gap:4px;font-size:14px;font-weight:600}
.cal button.out{visibility:hidden}
.cal button.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal button.sel{background:var(--fg);color:var(--bg)}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabbar-h)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px;stroke:currentColor}
.tabbar button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);height:56px;padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.fab svg{width:22px;height:22px;stroke:currentColor}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(10,8,6,.45)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-in{max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 14px}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.radios{display:flex;flex-wrap:wrap;gap:6px}
.radios label{position:relative}
.radios input{position:absolute;opacity:0;inset:0}
.radios span{display:inline-block;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600}
.radios input:checked + span{border-color:currentColor}
.radios input:focus-visible + span{outline:2px solid var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.calc{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:1}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}

.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1 class="brand"><span class="lamp" aria-hidden="true"></span>Mis Bolos</h1>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="seg" role="group" aria-label="Periodo">
          <button id="mode-mes" type="button" aria-pressed="true">Mes</button>
          <button id="mode-anio" type="button" aria-pressed="false">Año</button>
        </div>
        <button class="icon-btn" id="btn-ajustes" type="button" aria-label="Ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="period">
      <button class="icon-btn" id="prev" type="button" aria-label="Periodo anterior"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="label" id="period-label">—</div>
      <button class="icon-btn" id="next" type="button" aria-label="Periodo siguiente"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fab-label">Nuevo bolo</span></button>

<nav class="tabbar" aria-label="Secciones">
  <div class="tabbar-in">
    <button type="button" data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>Resumen</button>
    <button type="button" data-tab="bolos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Bolos</button>
    <button type="button" data-tab="gastos"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2-3-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Gastos</button>
    <button type="button" data-tab="empresas"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1M9 17h1M14 17h1"/></svg>Empresas</button>
  </div>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div><div id="sheet-body"></div></div></section>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const ESTADOS = {
  posible:{label:"Posible",cls:"idea"},
  reserva:{label:"En reserva",cls:"warn"},
  confirmado:{label:"Confirmado",cls:"ok"},
  realizado:{label:"Realizado",cls:"info"},
  cancelado:{label:"Cancelado",cls:"bad"}
};
const PAGOS = {pendiente:"Sin cobrar",parcial:"Cobrado en parte",pagado:"Cobrado"};
const CATS = {transporte:"Gasolina / transporte",km:"Kilometraje",peaje:"Peajes y parking",dietas:"Comidas y dietas",alojamiento:"Alojamiento",material:"Material y herramientas",formacion:"Formación",cuota:"Cuota de autónomos",gestoria:"Gestoría",otros:"Otros"};
const PUESTOS = ["Técnico de iluminación","Jefe de iluminación","Operador de mesa","Programador","Montaje / desmontaje","Cañón de seguimiento","Rigger","Diseño de iluminación","Técnico de vídeo","Auxiliar"];
const DEF_AJUSTES = {autonomo:true,irpf:15,iva:21,km:0.26,plazo:30};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const LS_KEY = "mis-bolos-v1";

/* ---------- state ---------- */
const S = {
  bolos:new Map(), gastos:new Map(), empresas:new Map(), ajustes:{...DEF_AJUSTES},
  loaded:false, storeKind:"cargando", note:""
};
const today = new Date();
const UI = {tab:"resumen",mode:"mes",y:today.getFullYear(),m:today.getMonth(),bolosView:"lista",filtro:"todos",dia:null};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(today);
const parse = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };
const fmtEUR = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const eur = n => fmtEUR.format(Math.round((n||0)*100)/100);
const fmtDate = s => { if(!s) return ""; const d=parse(s); return d.getDate()+" "+MESES[d.getMonth()].slice(0,3); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const slug = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,80) || "sin-empresa";

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- domain ---------- */
const bolosArr = () => [...S.bolos.entries()].map(([id,b])=>({id,...b}));
const gastosArr = () => [...S.gastos.entries()].map(([id,g])=>({id,...g}));
const importe = b => b.tipoPrecio==="jornada" ? num(b.precio)*Math.max(num(b.jornadas)||1,0) : num(b.precio);
const activo = b => b.estado==="confirmado" || b.estado==="realizado";
const finDe = b => b.fechaFin && b.fechaFin>=b.fecha ? b.fechaFin : b.fecha;
const hecho = b => b.estado==="realizado" || (b.estado==="confirmado" && finDe(b) < TODAY);
const cobradoDe = b => b.pago==="pagado" ? importe(b) : b.pago==="parcial" ? Math.min(num(b.cobrado),importe(b)) : 0;
const pendienteDe = b => activo(b) ? Math.max(importe(b)-cobradoDe(b),0) : 0;
const gastosDe = id => gastosArr().filter(g=>g.boloId===id);
const plazoDe = nombre => { const e=S.empresas.get(slug(nombre)); return e && num(e.plazo)>0 ? num(e.plazo) : num(S.ajustes.plazo)||30; };
const atrasado = b => hecho(b) && pendienteDe(b)>0 && daysBetween(finDe(b),TODAY) > plazoDe(b.empresa);
function inPeriod(s){ if(!s) return false; return UI.mode==="mes" ? s.startsWith(UI.y+"-"+pad(UI.m+1)) : s.startsWith(UI.y+"-"); }
function periodLabel(){ return UI.mode==="mes" ? MESES[UI.m]+" "+UI.y : "Año "+UI.y; }
function empresasNombres(){ const set=new Map(); bolosArr().forEach(b=>{ if(b.empresa) set.set(slug(b.empresa),b.empresa); }); S.empresas.forEach((e,k)=>{ if(e.nombre && !set.has(k)) set.set(k,e.nombre); }); return [...set.values()].sort((a,b)=>a.localeCompare(b,"es")); }
function lugares(){ const s=new Set(); bolosArr().forEach(b=>b.lugar&&s.add(b.lugar)); gastosArr().forEach(g=>g.lugar&&s.add(g.lugar)); return [...s].sort((a,b)=>a.localeCompare(b,"es")); }
function conflictos(){
  const act = bolosArr().filter(b=>b.estado!=="cancelado" && b.estado!=="posible" && finDe(b)>=TODAY);
  const out=[];
  for(let i=0;i<act.length;i++) for(let j=i+1;j<act.length;j++){
    const a=act[i], b=act[j];
    if(a.fecha<=finDe(b) && b.fecha<=finDe(a)) out.push([a,b]);
  }
  return out;
}

/* ---------- storage layer: artifact db, or this device as fallback ---------- */
const Store = {
  db:null,
  async init(){
    let db=null;
    try{ db = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null; }catch(e){ db=null; }
    if(db){ this.db=db; S.storeKind="nube"; this.subscribe(); }
    else { S.storeKind="local"; this.loadLocal(); S.loaded=true; render(); }
  },
  subscribe(){
    const pending = new Set(["bolos","gastos","empresas","ajustes"]);
    const timer = setTimeout(()=>{ if(pending.size){ S.note="Los datos tardan en llegar. Revisa la conexión; se cargarán solos."; renderBanner(); } },10000);
    const done = (k,fromCache)=>{ if(!fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); if(S.note.startsWith("Los datos")) S.note=""; } } S.loaded=true; render(); };
    const onErr = e => { clearTimeout(timer); S.note = e && e.code==="revoked" ? "Ya no hay acceso a los datos en esta vista." : "No se pudieron cargar los datos ("+(e&&e.code||"error")+"). Cierra y vuelve a abrir la app."; S.loaded=true; render(); };
    ["bolos","gastos","empresas"].forEach(col=>{
      this.db.collection(col).onSnapshot(snap=>{
        S[col] = new Map(snap.docs.map(d=>[d.id,d.data()]));
        done(col,snap.metadata.fromCache);
      },onErr);
    });
    this.db.doc("ajustes/general").onSnapshot(s=>{
      S.ajustes = {...DEF_AJUSTES,...(s.exists?s.data():{})};
      done("ajustes",s.metadata.fromCache);
    },onErr);
  },
  loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){ const o=JSON.parse(raw);
        S.bolos=new Map(Object.entries(o.bolos||{})); S.gastos=new Map(Object.entries(o.gastos||{}));
        S.empresas=new Map(Object.entries(o.empresas||{})); S.ajustes={...DEF_AJUSTES,...(o.ajustes||{})}; }
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem(LS_KEY,JSON.stringify({bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes})); }
    catch(e){ toast("No se pudo guardar en este dispositivo"); }
  },
  async put(col,id,data){
    if(this.db){
      try{ if(col==="ajustes") await this.db.doc("ajustes/general").set(data); else await this.db.collection(col).doc(id).set(data); return true; }
      catch(e){ toast(e&&e.code==="quota_exceeded" ? "Sin espacio: borra registros antiguos" : "No se pudo guardar. Inténtalo otra vez"); return false; }
    }
    if(col==="ajustes") S.ajustes={...DEF_AJUSTES,...data}; else S[col].set(id,data);
    this.saveLocal(); render(); return true;
  },
  async del(col,id){
    if(this.db){ try{ await this.db.collection(col).doc(id).delete(); return true; }catch(e){ toast("No se pudo borrar"); return false; } }
    S[col].delete(id); this.saveLocal(); render(); return true;
  }
};

/* ---------- render ---------- */
function renderBanner(){
  const b=$("#banner");
  if(S.note){ b.innerHTML='<div class="banner warn">'+esc(S.note)+'</div>'; return; }
  if(S.storeKind==="local"){ b.innerHTML='<div class="banner">Guardando solo en este dispositivo. Haz copias desde Ajustes.</div>'; return; }
  b.innerHTML="";
}
function render(){
  $("#period-label").textContent = periodLabel();
  $("#mode-mes").setAttribute("aria-pressed",UI.mode==="mes");
  $("#mode-anio").setAttribute("aria-pressed",UI.mode==="anio");
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===UI.tab?"page":"false"));
  $("#fab-label").textContent = UI.tab==="gastos" ? "Nuevo gasto" : "Nuevo bolo";
  $("#fab").hidden = UI.tab==="empresas";
  renderBanner();
  const v=$("#view");
  if(!S.loaded){ v.innerHTML='<div class="empty"><strong>Cargando tus bolos…</strong>Un momento.</div>'; return; }
  v.innerHTML = UI.tab==="resumen" ? vResumen() : UI.tab==="bolos" ? vBolos() : UI.tab==="gastos" ? vGastos() : vEmpresas();
}

function chipEstado(b){ const e=ESTADOS[b.estado]||ESTADOS.posible; return '<span class="chip c-'+e.cls+'">'+e.label+'</span>'; }
function chipPago(b){
  if(!activo(b)) return "";
  if(b.pago==="pagado") return '<span class="chip c-ok">Cobrado</span>';
  if(atrasado(b)) return '<span class="chip c-bad">Cobro atrasado</span>';
  if(b.pago==="parcial") return '<span class="chip c-warn">Cobrado en parte</span>';
  return hecho(b) ? '<span class="chip c-warn">Sin cobrar</span>' : "";
}
function boloRow(b,opts={}){
  const d=parse(b.fecha); const g=gastosDe(b.id).reduce((s,x)=>s+num(x.importe),0);
  const dias = b.fechaFin && b.fechaFin>b.fecha ? " → "+fmtDate(b.fechaFin) : "";
  const sub=[b.empresa, b.lugar].filter(Boolean).join(" · ");
  const quick = opts.quickPay && pendienteDe(b)>0 ? '<button class="mini-btn go" type="button" data-cobrar="'+b.id+'">Cobrado</button>' : "";
  return '<div class="rowwrap"><button class="row'+(b.estado==="cancelado"?" cancel":"")+'" type="button" data-bolo="'+b.id+'">'+
    '<div class="datebox"><div class="d">'+d.getDate()+'</div><div class="w">'+(UI.mode==="anio"||opts.showMonth?MESES[d.getMonth()].slice(0,3):DIAS[d.getDay()])+'</div></div>'+
    '<div class="row-body"><div class="row-title">'+esc(b.evento||b.empresa||"Bolo sin nombre")+'</div>'+
    '<div class="row-sub">'+esc(sub||b.puesto||"")+(dias?esc(dias):"")+(b.hora?" · "+esc(b.hora):"")+'</div>'+
    '<div class="chips">'+chipEstado(b)+chipPago(b)+'</div></div>'+
    '<div class="row-amt"><div class="a num">'+eur(importe(b))+'</div>'+(g?'<div class="b num">−'+eur(g)+' gastos</div>':"")+
    (opts.showPend && pendienteDe(b)>0 && pendienteDe(b)<importe(b)?'<div class="b num">faltan '+eur(pendienteDe(b))+'</div>':"")+'</div></button>'+quick+'</div>';
}

function vResumen(){
  const A=S.ajustes;
  const bs = bolosArr().filter(b=>inPeriod(b.fecha));
  const act = bs.filter(activo);
  const ingresos = act.reduce((s,b)=>s+importe(b),0);
  const cobrado = act.reduce((s,b)=>s+cobradoDe(b),0);
  const gastos = gastosArr().filter(g=>inPeriod(g.fecha)).reduce((s,g)=>s+num(g.importe),0);
  const beneficio = ingresos-gastos;
  const jornadas = act.reduce((s,b)=>s+(num(b.jornadas)||1),0);
  const potencial = bs.filter(b=>b.estado==="posible"||b.estado==="reserva");
  const potImp = potencial.reduce((s,b)=>s+importe(b),0);
  const irpf = A.autonomo ? ingresos*num(A.irpf)/100 : 0;
  const iva = A.autonomo ? ingresos*num(A.iva)/100 : 0;
  let h='';
  if(!bolosArr().length && !gastosArr().length){
    h+='<div class="empty" style="margin-bottom:16px"><strong>Apunta tu primer bolo</strong>Pulsa «Nuevo bolo» abajo: empresa, fecha, lugar, precio pactado y estado. Los gastos los añades en la pestaña Gastos o dentro de cada bolo.</div>';
  }
  h+='<h2>'+esc(periodLabel())+'</h2><div class="card hero">'+
    '<div class="hero-main"><div><div class="cap">Te queda (ingresos − gastos)</div><div class="big num" style="color:'+(beneficio<0?"var(--bad)":"var(--fg)")+'">'+eur(beneficio)+'</div></div>'+
    '<div class="small muted">'+act.length+' bolo'+(act.length===1?"":"s")+' · '+(Math.round(jornadas*10)/10)+' jornada'+(jornadas===1?"":"s")+'</div></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><div class="k">Ingresos</div><div class="v num">'+eur(ingresos)+'</div></div>'+
      '<div class="kpi"><div class="k">Cobrado</div><div class="v num pos">'+eur(cobrado)+'</div></div>'+
      '<div class="kpi"><div class="k">Gastos</div><div class="v num'+(gastos?" neg":"")+'">'+eur(gastos)+'</div></div>'+
      '<div class="kpi"><div class="k">Media / jornada</div><div class="v num">'+(jornadas?eur(ingresos/jornadas):"—")+'</div></div>'+
    '</div>'+
    (potencial.length?'<div class="small muted">Además tienes '+potencial.length+' bolo'+(potencial.length===1?"":"s")+' posible'+(potencial.length===1?"":"s")+' o en reserva por <span class="num">'+eur(potImp)+'</span>.</div>':"")+
    (A.autonomo && ingresos?'<div class="tax"><div><span class="muted">Retención IRPF ('+num(A.irpf)+' %)</span><span class="num">−'+eur(irpf)+'</span></div>'+
      '<div><span class="muted">Neto tras IRPF y gastos</span><strong class="num">'+eur(beneficio-irpf)+'</strong></div>'+
      '<div><span class="muted">IVA a apartar para Hacienda ('+num(A.iva)+' %)</span><span class="num">'+eur(iva)+'</span></div></div>':"")+
  '</div>';

  // pendiente de cobro (global)
  const pend = bolosArr().filter(b=>pendienteDe(b)>0 && (hecho(b)||b.pago==="parcial")).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const totPend = pend.reduce((s,b)=>s+pendienteDe(b),0);
  h+='<h2>Pendiente de cobro · <span class="num">'+eur(totPend)+'</span></h2>';
  h+= pend.length ? '<div class="stack">'+pend.map(b=>boloRow(b,{quickPay:true,showMonth:true,showPend:true})).join("")+'</div>'
    : '<div class="empty">Nada pendiente. Todo lo trabajado está cobrado.</div>';

  // próximos
  const prox = bolosArr().filter(b=>finDe(b)>=TODAY && b.estado!=="cancelado").sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,6);
  const conf = conflictos();
  h+='<h2>Próximos bolos</h2>';
  if(conf.length) h+='<div class="banner warn">Ojo: tienes bolos que se solapan: '+conf.map(([a,b])=>esc(fmtDate(a.fecha))+' ('+esc(a.evento||a.empresa)+' y '+esc(b.evento||b.empresa)+')').join("; ")+'.</div>';
  h+= prox.length ? '<div class="stack">'+prox.map(b=>boloRow(b,{showMonth:true})).join("")+'</div>' : '<div class="empty">No tienes bolos apuntados a partir de hoy.</div>';

  // por empresa en el periodo
  const porEmp = new Map();
  act.forEach(b=>{ const k=b.empresa||"Sin empresa"; porEmp.set(k,(porEmp.get(k)||0)+importe(b)); });
  if(porEmp.size){
    const max=Math.max(...porEmp.values());
    h+='<h2>Quién te ha dado trabajo</h2><div class="card" style="padding:4px 14px">'+[...porEmp.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:10px"><span>'+esc(k)+'</span><span class="num">'+eur(v)+'</span></div><div class="bar"><i style="width:'+(max?Math.round(v/max*100):0)+'%"></i></div></div>').join("")+'</div>';
  }
  return h;
}

function vBolos(){
  let h='<div class="toolbar"><div class="seg" role="group" aria-label="Vista">'+
    '<button type="button" data-bview="lista" aria-pressed="'+(UI.bolosView==="lista")+'">Lista</button>'+
    '<button type="button" data-bview="cal" aria-pressed="'+(UI.bolosView==="cal")+'"'+(UI.mode==="anio"?" disabled":"")+'>Calendario</button></div></div>';
  const filtros=[["todos","Todos"],["confirmado","Confirmados"],["reserva","En reserva"],["posible","Posibles"],["realizado","Realizados"],["sincobrar","Sin cobrar"],["cancelado","Cancelados"]];
  let bs = bolosArr().filter(b=>inPeriod(b.fecha)).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(UI.bolosView==="cal" && UI.mode==="mes"){
    h+=calendar(bs);
    if(UI.dia){
      const dd = bs.filter(b=>b.fecha<=UI.dia && finDe(b)>=UI.dia);
      h+='<h2>'+esc(DIAS[parse(UI.dia).getDay()]+" "+fmtDate(UI.dia))+'</h2>'+(dd.length?'<div class="stack">'+dd.map(b=>boloRow(b)).join("")+'</div>':'<div class="empty">Día libre.</div>')+
        '<div class="actions" style="margin-top:10px"><button class="btn" type="button" data-nuevo-dia="'+UI.dia+'">Añadir bolo este día</button></div>';
    } else h+='<p class="hint">Toca un día para ver sus bolos o apuntar uno nuevo.</p>';
    return h;
  }
  h+='<div class="filters" role="group" aria-label="Filtrar">'+filtros.map(([k,l])=>'<button type="button" data-filtro="'+k+'" aria-pressed="'+(UI.filtro===k)+'">'+l+'</button>').join("")+'</div>';
  if(UI.filtro==="sincobrar") bs=bs.filter(b=>pendienteDe(b)>0);
  else if(UI.filtro!=="todos") bs=bs.filter(b=>b.estado===UI.filtro);
  if(!bs.length) return h+'<div class="empty"><strong>No hay bolos aquí</strong>Cambia de periodo o filtro, o pulsa «Nuevo bolo».</div>';
  const tot = bs.filter(activo).reduce((s,b)=>s+importe(b),0);
  h+='<p class="small muted" style="margin:0 0 10px">'+bs.length+' bolo'+(bs.length===1?"":"s")+' · confirmados y realizados suman <span class="num">'+eur(tot)+'</span></p>';
  if(UI.mode==="anio"){
    const groups=new Map(); bs.forEach(b=>{ const k=b.fecha.slice(0,7); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(b); });
    groups.forEach((arr,k)=>{ h+='<h2>'+MESES[Number(k.slice(5))-1]+'</h2><div class="stack">'+arr.map(b=>boloRow(b)).join("")+'</div>'; });
  } else h+='<div class="stack">'+bs.map(b=>boloRow(b)).join("")+'</div>';
  return h;
}
function calendar(bs){
  const first=new Date(UI.y,UI.m,1); const startDow=(first.getDay()+6)%7; const n=new Date(UI.y,UI.m+1,0).getDate();
  let h='<div class="card cal">'+["L","M","X","J","V","S","D"].map(d=>'<div class="hd">'+d+'</div>').join("");
  for(let i=0;i<startDow;i++) h+='<button class="out" type="button" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1; d<=n; d++){
    const ds=UI.y+"-"+pad(UI.m+1)+"-"+pad(d);
    const on=bolosArr().filter(b=>b.fecha<=ds && finDe(b)>=ds);
    h+='<button type="button" data-dia="'+ds+'" class="'+(ds===TODAY?"today ":"")+(ds===UI.dia?"sel":"")+'" aria-label="'+d+' de '+MESES[UI.m]+(on.length?", "+on.length+" bolo(s)":"")+'">'+d+
      '<span class="dots">'+on.slice(0,4).map(b=>'<i class="dot d-'+(ESTADOS[b.estado]||ESTADOS.posible).cls+'"></i>').join("")+'</span></button>';
  }
  h+='</div><div class="chips" style="margin:8px 0 4px">'+Object.values(ESTADOS).map(e=>'<span class="chip c-plain"><i class="dot d-'+e.cls+'"></i> '+e.label+'</span>').join("")+'</div>';
  return h;
}

function vGastos(){
  const gs = gastosArr().filter(g=>inPeriod(g.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  if(!gs.length) return '<div class="empty"><strong>Sin gastos en '+esc(periodLabel())+'</strong>Apunta gasolina, peajes, dietas, material o la cuota de autónomos con «Nuevo gasto». Puedes asociarlos a un bolo para saber cuánto te deja cada uno.</div>';
  const tot=gs.reduce((s,g)=>s+num(g.importe),0);
  const porCat=new Map(); gs.forEach(g=>porCat.set(g.categoria||"otros",(porCat.get(g.categoria||"otros")||0)+num(g.importe)));
  let h='<div class="card hero"><div class="hero-main"><div><div class="cap">Gastos de '+esc(periodLabel())+'</div><div class="big num">'+eur(tot)+'</div></div><div class="small muted">'+gs.length+' apunte'+(gs.length===1?"":"s")+'</div></div>'+
    '<div class="stack">'+[...porCat.entries()].sort((a,b)=>b[1]-a[1]).map(([k,v])=>'<div><div style="display:flex;justify-content:space-between;gap:10px;font-size:14px"><span>'+esc(CATS[k]||k)+'</span><span class="num">'+eur(v)+'</span></div><div class="bar"><i style="width:'+Math.round(v/tot*100)+'%"></i></div></div>').join("")+'</div></div>';
  h+='<h2>Apuntes</h2><div class="stack">'+gs.map(g=>{
    const b=g.boloId?S.bolos.get(g.boloId):null; const d=parse(g.fecha);
    const sub=[CATS[g.categoria]||"Otros", b?(b.evento||b.empresa):"", g.lugar].filter(Boolean).join(" · ");
    return '<button class="row" type="button" data-gasto="'+g.id+'"><div class="datebox"><div class="d">'+d.getDate()+'</div><div class="w">'+(UI.mode==="anio"?MESES[d.getMonth()].slice(0,3):DIAS[d.getDay()])+'</div></div>'+
      '<div class="row-body"><div class="row-title">'+esc(g.concepto||CATS[g.categoria]||"Gasto")+'</div><div class="row-sub">'+esc(sub)+'</div></div>'+
      '<div class="row-amt"><div class="a num">'+eur(num(g.importe))+'</div>'+(g.categoria==="km"&&g.km?'<div class="b num">'+esc(g.km)+' km</div>':"")+'</div></button>';
  }).join("")+'</div>';
  return h;
}

function vEmpresas(){
  const names=empresasNombres();
  if(!names.length) return '<div class="empty"><strong>Aún no hay empresas</strong>Aparecen solas cuando apuntas un bolo con su empresa. Aquí verás cuánto te ha pagado cada una, lo que te debe y sus datos de contacto.</div>';
  const all=bolosArr();
  const rows=names.map(n=>{
    const k=slug(n); const bs=all.filter(b=>slug(b.empresa)===k);
    const act=bs.filter(activo);
    return {n,k,info:S.empresas.get(k)||{},count:act.length,per:act.filter(b=>inPeriod(b.fecha)).reduce((s,b)=>s+importe(b),0),
      total:act.reduce((s,b)=>s+importe(b),0),pend:bs.reduce((s,b)=>s+pendienteDe(b),0),late:bs.some(atrasado),
      last:act.map(b=>b.fecha).sort().pop()};
  }).sort((a,b)=>b.per-a.per||b.total-a.total);
  return '<p class="small muted" style="margin:0 0 10px">Ordenadas por lo facturado en '+esc(periodLabel())+'. Toca una para guardar contacto y plazo de pago.</p><div class="stack">'+rows.map(r=>
    '<button class="row" type="button" data-empresa="'+esc(r.k)+'" data-nombre="'+esc(r.n)+'" style="align-items:flex-start"><div class="row-body">'+
      '<div class="row-title">'+esc(r.n)+'</div>'+
      '<div class="row-sub">'+r.count+' bolo'+(r.count===1?"":"s")+' en total · último '+(r.last?esc(fmtDate(r.last)+" "+r.last.slice(0,4)):"—")+'</div>'+
      (r.info.contacto||r.info.telefono?'<div class="row-sub">'+esc([r.info.contacto,r.info.telefono].filter(Boolean).join(" · "))+'</div>':"")+
      '<div class="chips">'+(r.pend>0?'<span class="chip '+(r.late?"c-bad":"c-warn")+'">Te debe '+eur(r.pend)+'</span>':'<span class="chip c-ok">Al día</span>')+
      '<span class="chip c-plain">Paga a '+plazoDe(r.n)+' días</span></div></div>'+
      '<div class="row-amt"><div class="a num">'+eur(r.per)+'</div><div class="b">histórico <span class="num">'+eur(r.total)+'</span></div></div></button>').join("")+'</div>';
}

/* ---------- sheets ---------- */
function openSheet(html,onReady){
  $("#sheet-body").innerHTML=html; $("#sheet").hidden=false; $("#backdrop").hidden=false;
  document.body.style.overflow="hidden"; $("#sheet").scrollTop=0;
  if(onReady) onReady($("#sheet-body"));
}
function closeSheet(){ $("#sheet").hidden=true; $("#backdrop").hidden=true; document.body.style.overflow=""; $("#sheet-body").innerHTML=""; }
$("#backdrop").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });

const opt = (v,l,sel) => '<option value="'+esc(v)+'"'+(String(v)===String(sel)?" selected":"")+'>'+esc(l)+'</option>';
const datalist = (id,arr) => '<datalist id="'+id+'">'+arr.map(x=>'<option value="'+esc(x)+'"></option>').join("")+'</datalist>';
function armDelete(btn,fn){
  btn.addEventListener("click",()=>{
    if(btn.classList.contains("armed")){ fn(); return; }
    btn.classList.add("armed"); btn.textContent="Pulsa otra vez para borrar";
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent="Borrar"; } },4000);
  });
}

function boloForm(id,preset){
  const b = id ? {...S.bolos.get(id)} : {fecha:TODAY,estado:"confirmado",pago:"pendiente",tipoPrecio:"total",jornadas:1,...(preset||{})};
  const radios = Object.entries(ESTADOS).map(([k,e])=>'<label><input type="radio" name="estado" value="'+k+'"'+(b.estado===k?" checked":"")+'><span class="r-'+e.cls+'">'+e.label+'</span></label>').join("");
  const gs = id ? gastosDe(id) : [];
  const gtot = gs.reduce((s,g)=>s+num(g.importe),0);
  const html='<h3>'+(id?"Editar bolo":"Nuevo bolo")+'</h3><form id="f-bolo" autocomplete="off">'+
    '<div class="field"><label for="b-evento">Evento o nombre</label><input id="b-evento" name="evento" value="'+esc(b.evento)+'" placeholder="Concierto, feria, gala…"></div>'+
    '<div class="field"><label for="b-empresa">Empresa que te contrata</label><input id="b-empresa" name="empresa" list="dl-emp" value="'+esc(b.empresa)+'" placeholder="Nombre de la empresa"></div>'+datalist("dl-emp",empresasNombres())+
    '<div class="two"><div class="field"><label for="b-fecha">Fecha</label><input id="b-fecha" type="date" name="fecha" required value="'+esc(b.fecha)+'"></div>'+
    '<div class="field"><label for="b-fin">Hasta (si dura más días)</label><input id="b-fin" type="date" name="fechaFin" value="'+esc(b.fechaFin)+'"></div></div>'+
    '<div class="two"><div class="field"><label for="b-hora">Hora de citación</label><input id="b-hora" type="time" name="hora" value="'+esc(b.hora)+'"></div>'+
    '<div class="field"><label for="b-jornadas">Jornadas</label><input id="b-jornadas" type="number" inputmode="decimal" step="0.5" min="0" name="jornadas" value="'+esc(b.jornadas)+'"></div></div>'+
    '<div class="field"><label for="b-lugar">Lugar</label><input id="b-lugar" name="lugar" list="dl-lug" value="'+esc(b.lugar)+'" placeholder="Sala, teatro, recinto, ciudad"></div>'+datalist("dl-lug",lugares())+
    '<div class="field"><label for="b-puesto">Tu puesto</label><input id="b-puesto" name="puesto" list="dl-puesto" value="'+esc(b.puesto)+'" placeholder="Técnico de iluminación"></div>'+datalist("dl-puesto",PUESTOS)+
    '<div class="two"><div class="field"><label for="b-precio">Precio pactado (€, sin IVA)</label><input id="b-precio" type="number" inputmode="decimal" step="0.01" min="0" name="precio" value="'+esc(b.precio)+'"></div>'+
    '<div class="field"><label for="b-tipo">Ese precio es</label><select id="b-tipo" name="tipoPrecio">'+opt("total","Total del bolo",b.tipoPrecio)+opt("jornada","Por jornada",b.tipoPrecio)+'</select></div></div>'+
    '<div class="calc" id="b-calc"></div>'+
    '<div class="field"><span class="lbl">Estado</span><div class="radios" id="b-estado">'+radios+'</div></div>'+
    '<div class="two"><div class="field"><label for="b-pago">Cobro</label><select id="b-pago" name="pago">'+Object.entries(PAGOS).map(([k,l])=>opt(k,l,b.pago)).join("")+'</select></div>'+
    '<div class="field"><label for="b-fcobro">Fecha de cobro</label><input id="b-fcobro" type="date" name="fechaCobro" value="'+esc(b.fechaCobro)+'"></div></div>'+
    '<div class="field" id="b-cobrado-wrap"><label for="b-cobrado">Cuánto te han pagado ya (€)</label><input id="b-cobrado" type="number" inputmode="decimal" step="0.01" min="0" name="cobrado" value="'+esc(b.cobrado)+'"></div>'+
    '<div class="field"><label for="b-factura">Nº de factura</label><input id="b-factura" name="factura" value="'+esc(b.factura)+'" placeholder="Opcional"></div>'+
    '<div class="field"><label for="b-notas">Notas</label><textarea id="b-notas" name="notas" placeholder="Contacto en el bolo, material, horarios…">'+esc(b.notas)+'</textarea></div>'+
    (id?'<div class="field"><span class="lbl">Gastos de este bolo · <span class="num">'+eur(gtot)+'</span> · te deja <span class="num">'+eur(importe(b)-gtot)+'</span></span>'+
      (gs.length?'<div class="stack">'+gs.map(g=>'<button class="row" type="button" data-gasto="'+g.id+'" style="padding:10px"><div class="row-body"><div class="row-title">'+esc(g.concepto||CATS[g.categoria]||"Gasto")+'</div><div class="row-sub">'+esc(fmtDate(g.fecha)+" · "+(CATS[g.categoria]||""))+'</div></div><div class="row-amt"><div class="a num">'+eur(num(g.importe))+'</div></div></button>').join("")+'</div>':"")+
      '<button class="btn" type="button" id="b-addgasto">Añadir gasto a este bolo</button></div>':"")+
    '<div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="b-cancel">Cancelar</button></div>'+
    (id?'<div class="actions"><button class="btn" type="button" id="b-dup">Duplicar</button><button class="btn danger" type="button" id="b-del">Borrar</button></div>':"")+
  '</form>';
  openSheet(html,root=>{
    const f=root.querySelector("#f-bolo");
    root.querySelectorAll(".radios span").forEach(s=>{ const cls=s.className.replace("r-",""); s.dataset.cls=cls; });
    const paintRadios=()=>root.querySelectorAll(".radios input").forEach(i=>{ const s=i.nextElementSibling; s.className = i.checked ? "c-"+s.dataset.cls : ""; });
    const calc=()=>{
      const tmp={precio:f.precio.value,tipoPrecio:f.tipoPrecio.value,jornadas:f.jornadas.value};
      const A=S.ajustes, base=importe(tmp);
      f.querySelector("#b-calc").innerHTML = '<span class="muted">Total del bolo</span><span class="num"><strong>'+eur(base)+'</strong>'+(A.autonomo&&base?' · factura <span>'+eur(base*(1+num(A.iva)/100-num(A.irpf)/100))+'</span>':"")+'</span>';
      root.querySelector("#b-cobrado-wrap").hidden = f.pago.value!=="parcial";
    };
    const syncDays=()=>{ if(f.fechaFin.value && f.fecha.value && f.fechaFin.value>=f.fecha.value && (!id || !b.jornadas || num(b.jornadas)<=1)){ f.jornadas.value=daysBetween(f.fecha.value,f.fechaFin.value)+1; calc(); } };
    paintRadios(); calc();
    root.querySelector("#b-estado").addEventListener("change",paintRadios);
    ["precio","tipoPrecio","jornadas","pago"].forEach(n=>f[n].addEventListener("input",calc));
    f.pago.addEventListener("change",()=>{ if(f.pago.value==="pagado" && !f.fechaCobro.value) f.fechaCobro.value=TODAY; calc(); });
    f.fechaFin.addEventListener("change",syncDays);
    root.querySelector("#b-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f); const o={};
      ["evento","empresa","fecha","fechaFin","hora","lugar","puesto","tipoPrecio","pago","fechaCobro","factura","notas","estado"].forEach(k=>o[k]=String(fd.get(k)||"").trim());
      o.precio=num(fd.get("precio")); o.jornadas=num(fd.get("jornadas"))||1; o.cobrado=num(fd.get("cobrado"));
      if(!o.fecha){ toast("Pon la fecha del bolo"); return; }
      if(!o.evento && !o.empresa){ toast("Pon al menos el evento o la empresa"); f.evento.focus(); return; }
      if(o.fechaFin && o.fechaFin<o.fecha) o.fechaFin="";
      if(o.pago!=="parcial") o.cobrado = o.pago==="pagado" ? importe(o) : 0;
      if(o.estado==="confirmado" && finDe(o)<TODAY && o.pago==="pagado") o.estado="realizado";
      o.actualizado=new Date().toISOString(); if(!id) o.creado=o.actualizado; else o.creado=b.creado||o.actualizado;
      const ok=await Store.put("bolos",id||newId(),o);
      if(ok){ closeSheet(); toast(id?"Bolo guardado":"Bolo apuntado"); }
    });
    if(id){
      root.querySelector("#b-addgasto").addEventListener("click",()=>gastoForm(null,{boloId:id,fecha:b.fecha,lugar:b.lugar}));
      root.querySelector("#b-dup").addEventListener("click",()=>{ const c={...b}; delete c.factura; c.pago="pendiente"; c.cobrado=0; c.fechaCobro=""; c.estado="confirmado"; boloForm(null,c); toast("Copia lista: cambia la fecha y guarda"); });
      armDelete(root.querySelector("#b-del"),async()=>{ if(await Store.del("bolos",id)){ closeSheet(); toast("Bolo borrado"); } });
    }
  });
}

function gastoForm(id,preset){
  const g = id ? {...S.gastos.get(id)} : {fecha:TODAY,categoria:"transporte",...(preset||{})};
  const bs = bolosArr().filter(b=>b.estado!=="cancelado" || b.id===g.boloId).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,120);
  const html='<h3>'+(id?"Editar gasto":"Nuevo gasto")+'</h3><form id="f-gasto" autocomplete="off">'+
    '<div class="field"><label for="g-concepto">Concepto</label><input id="g-concepto" name="concepto" value="'+esc(g.concepto)+'" placeholder="Gasolina ida y vuelta, comida, guantes…"></div>'+
    '<div class="two"><div class="field"><label for="g-cat">Tipo</label><select id="g-cat" name="categoria">'+Object.entries(CATS).map(([k,l])=>opt(k,l,g.categoria)).join("")+'</select></div>'+
    '<div class="field"><label for="g-fecha">Fecha</label><input id="g-fecha" type="date" name="fecha" required value="'+esc(g.fecha)+'"></div></div>'+
    '<div class="field" id="g-km-wrap"><label for="g-km">Kilómetros</label><input id="g-km" type="number" inputmode="decimal" step="1" min="0" name="km" value="'+esc(g.km)+'"><span class="hint" id="g-km-hint"></span></div>'+
    '<div class="field"><label for="g-importe">Importe (€)</label><input id="g-importe" type="number" inputmode="decimal" step="0.01" min="0" name="importe" required value="'+esc(g.importe)+'"></div>'+
    '<div class="field"><label for="g-bolo">¿De qué bolo?</label><select id="g-bolo" name="boloId">'+opt("","Ninguno (gasto general)",g.boloId||"")+bs.map(b=>opt(b.id,fmtDate(b.fecha)+" "+b.fecha.slice(0,4)+" · "+(b.evento||b.empresa||"Bolo"),g.boloId)).join("")+'</select></div>'+
    '<div class="field"><label for="g-lugar">Lugar</label><input id="g-lugar" name="lugar" list="dl-lug2" value="'+esc(g.lugar)+'" placeholder="Dónde fue el gasto"></div>'+datalist("dl-lug2",lugares())+
    '<div class="field"><label for="g-notas">Notas</label><textarea id="g-notas" name="notas" placeholder="¿Tienes el tique? ¿Lo paga la empresa?">'+esc(g.notas)+'</textarea></div>'+
    '<div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="g-cancel">Cancelar</button></div>'+
    (id?'<div class="actions"><button class="btn danger" type="button" id="g-del">Borrar</button></div>':"")+
  '</form>';
  openSheet(html,root=>{
    const f=root.querySelector("#f-gasto");
    const kmSync=(fromKm)=>{
      const isKm=f.categoria.value==="km"; root.querySelector("#g-km-wrap").hidden=!isKm;
      const rate=num(S.ajustes.km)||0.26;
      root.querySelector("#g-km-hint").textContent="A "+String(rate).replace(".",",")+" €/km (cámbialo en Ajustes)";
      if(isKm && fromKm) f.importe.value=(num(f.km.value)*rate).toFixed(2);
    };
    kmSync(false);
    f.categoria.addEventListener("change",()=>kmSync(true));
    f.km.addEventListener("input",()=>kmSync(true));
    f.boloId.addEventListener("change",()=>{ const b=S.bolos.get(f.boloId.value); if(b && !f.lugar.value) f.lugar.value=b.lugar||""; });
    root.querySelector("#g-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f); const o={};
      ["concepto","categoria","fecha","boloId","lugar","notas"].forEach(k=>o[k]=String(fd.get(k)||"").trim());
      o.importe=num(fd.get("importe")); o.km=o.categoria==="km"?num(fd.get("km")):0;
      if(!o.fecha){ toast("Pon la fecha del gasto"); return; }
      if(!o.importe){ toast("Pon el importe"); f.importe.focus(); return; }
      o.actualizado=new Date().toISOString();
      const ok=await Store.put("gastos",id||newId(),o);
      if(ok){ closeSheet(); toast(id?"Gasto guardado":"Gasto apuntado"); }
    });
    if(id) armDelete(root.querySelector("#g-del"),async()=>{ if(await Store.del("gastos",id)){ closeSheet(); toast("Gasto borrado"); } });
  });
}

/* ---------- export / import ---------- */
async function saveFile(filename,data){
  let dl=null; try{ dl = window.claude && await window.claude.use("downloads"); }catch(e){}
  if(!dl){ toast("Descargar no está disponible en esta vista"); return; }
  try{ const r=await dl.save({filename,data}); if(r && r.status==="saved") toast("Archivo guardado"); }
  catch(e){ if(e && e.code!=="cancelled" && e.code!=="declined") toast("No se pudo guardar el archivo"); }
}
const csvCell = v => { const s=String(v==null?"":v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const dec = n => String(Math.round((n||0)*100)/100).replace(".",",");
function exportCSV(kind){
  let rows;
  if(kind==="bolos"){
    rows=[["Fecha","Hasta","Evento","Empresa","Lugar","Puesto","Jornadas","Importe","Estado","Cobro","Cobrado","Pendiente","Fecha cobro","Factura","Gastos asociados","Te deja","Notas"]];
    bolosArr().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(b=>{ const g=gastosDe(b.id).reduce((s,x)=>s+num(x.importe),0);
      rows.push([b.fecha,b.fechaFin,b.evento,b.empresa,b.lugar,b.puesto,dec(num(b.jornadas)||1),dec(importe(b)),(ESTADOS[b.estado]||{}).label,PAGOS[b.pago]||"",dec(cobradoDe(b)),dec(pendienteDe(b)),b.fechaCobro,b.factura,dec(g),dec(importe(b)-g),b.notas]); });
  } else {
    rows=[["Fecha","Concepto","Tipo","Importe","Km","Bolo","Lugar","Notas"]];
    gastosArr().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(g=>{ const b=g.boloId?S.bolos.get(g.boloId):null;
      rows.push([g.fecha,g.concepto,CATS[g.categoria]||"",dec(num(g.importe)),g.km||"",b?(b.evento||b.empresa):"",g.lugar,g.notas]); });
  }
  saveFile(kind+"-"+TODAY+".csv","﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"));
}
function exportJSON(){
  saveFile("mis-bolos-copia-"+TODAY+".json",JSON.stringify({app:"mis-bolos",version:1,fecha:TODAY,bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes},null,1));
}
$("#import-file").addEventListener("change",async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const o=JSON.parse(await file.text());
    if(o.app!=="mis-bolos") throw new Error("formato");
    let n=0;
    for(const col of ["bolos","gastos","empresas"]) for(const [id,d] of Object.entries(o[col]||{})){ if(/^[A-Za-z0-9_.~:@+-]+$/.test(id) && d && typeof d==="object"){ await Store.put(col,id,d); n++; } }
    if(o.ajustes) await Store.put("ajustes","general",{...DEF_AJUSTES,...o.ajustes});
    closeSheet(); toast(n+" registros restaurados");
  }catch(err){ toast("Ese archivo no es una copia de Mis Bolos"); }
});

/* ---------- events ---------- */
function setTab(t){ UI.tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); window.scrollTo(0,0); }
document.querySelectorAll(".tabbar button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
$("#mode-mes").addEventListener("click",()=>{ UI.mode="mes"; render(); });
$("#mode-anio").addEventListener("click",()=>{ UI.mode="anio"; UI.dia=null; render(); });
function shift(d){ if(UI.mode==="anio") UI.y+=d; else { UI.m+=d; if(UI.m<0){UI.m=11;UI.y--;} if(UI.m>11){UI.m=0;UI.y++;} } UI.dia=null; render(); }
$("#prev").addEventListener("click",()=>shift(-1));
$("#next").addEventListener("click",()=>shift(1));
$("#btn-ajustes").addEventListener("click",ajustesForm);
$("#fab").addEventListener("click",()=>{
  if(UI.tab==="gastos"){ gastoForm(null, UI.mode==="mes" && !inPeriod(TODAY) ? {fecha:UI.y+"-"+pad(UI.m+1)+"-01"} : null); }
  else boloForm(null, UI.dia ? {fecha:UI.dia} : (UI.mode==="mes" && !inPeriod(TODAY) ? {fecha:UI.y+"-"+pad(UI.m+1)+"-01"} : null));
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-bolo],[data-gasto],[data-empresa],[data-filtro],[data-bview],[data-dia],[data-nuevo-dia],[data-cobrar]");
  if(!t) return;
  if(t.dataset.cobrar){
    const id=t.dataset.cobrar, b=S.bolos.get(id); if(!b) return;
    const o={...b,pago:"pagado",cobrado:importe(b),fechaCobro:TODAY,actualizado:new Date().toISOString()};
    if(o.estado==="confirmado") o.estado="realizado";
    t.disabled=true; if(await Store.put("bolos",id,o)) toast("Marcado como cobrado");
    return;
  }
  if(t.dataset.bolo) return boloForm(t.dataset.bolo);
  if(t.dataset.gasto) return gastoForm(t.dataset.gasto);
  if(t.dataset.empresa) return empresaForm(t.dataset.empresa,t.dataset.nombre);
  if(t.dataset.filtro){ UI.filtro=t.dataset.filtro; return render(); }
  if(t.dataset.bview){ UI.bolosView=t.dataset.bview; return render(); }
  if(t.dataset.dia){ UI.dia = UI.dia===t.dataset.dia ? null : t.dataset.dia; return render(); }
  if(t.dataset.nuevoDia) return boloForm(null,{fecha:t.dataset.nuevoDia});
});
function fromHash(){ const h=(location.hash||"").slice(1); if(["resumen","bolos","gastos","empresas"].includes(h)) UI.tab=h; }
window.addEventListener("hashchange",()=>{ fromHash(); render(); });
fromHash();
render();
Store.init();
})();
</script>
