<title>Mis Bolos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2563c9">
<style>
/* Layout: plain Android-style app. Light grey ground, white cards, three-tab bottom navigation, short bottom-sheet forms. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eef0f3; --fg:#1b1d21; --muted:#646a73; --line:#e1e4e8;
  --accent:#2563c9; --accent-fg:#ffffff; --accent-soft:#e3ecfb;
  --ok:#1e7a45; --ok-bg:#e2f3e8; --warn:#9a6200; --warn-bg:#fbf0d9; --bad:#b4332c; --bad-bg:#fbe4e2;
  --info:#2457a8; --info-bg:#e1eaf8;
  --font:system-ui,-apple-system,"Roboto","Segoe UI",Helvetica,Arial,sans-serif;
  --tabbar-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --surface:#1c1e21; --surface-2:#26292d; --fg:#eceef1; --muted:#9aa0a8; --line:#2f3337;
  --accent:#7aa7f5; --accent-fg:#0d1a33; --accent-soft:#1d2a40;
  --ok:#6fcf93; --ok-bg:#1b3125; --warn:#e8b65a; --warn-bg:#352a15; --bad:#f08a83; --bad-bg:#3b2120;
  --info:#8ab2f0; --info-bg:#1d2a3e; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1c1e21; --surface-2:#26292d; --fg:#eceef1; --muted:#9aa0a8; --line:#2f3337;
  --accent:#7aa7f5; --accent-fg:#0d1a33; --accent-soft:#1d2a40;
  --ok:#6fcf93; --ok-bg:#1b3125; --warn:#e8b65a; --warn-bg:#352a15; --bad:#f08a83; --bad-bg:#3b2120;
  --info:#8ab2f0; --info-bg:#1d2a3e; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--warn);font-weight:500}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.icon-btn{border:0;background:transparent;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px;stroke:var(--fg)}
.banner{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}

h2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;font-weight:600;color:var(--muted);margin:26px 4px 8px}
h2 .num{color:var(--fg);font-size:16px}
h2 .link{border:0;background:none;padding:0;color:var(--accent);font-size:14px;font-weight:600}
.card{background:var(--surface);border-radius:18px}
.note{background:var(--surface);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:15px}
.empty{padding:24px 18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:18px;font-size:15px}
.empty strong{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* month switcher */
.mnav{display:flex;align-items:center;gap:4px}
.mnav .mid{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.mnav .label{font-weight:600;font-size:16px}
.back{border:0;background:none;padding:2px 6px;color:var(--accent);font-size:13px;font-weight:600}

/* month summary */
.sum{padding:10px 12px 16px}
.sum .cap{margin-top:10px;text-align:center;font-size:15px;color:var(--muted)}
.sum .big{text-align:center;font-size:42px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.sum .lines{margin-top:6px;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:15px;color:var(--muted);padding:0 6px}
.sum .lines strong{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.sum .year{margin:14px 4px 0;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:14px;color:var(--muted)}
.sum .year strong{color:var(--fg);font-variant-numeric:tabular-nums}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:16px;font-size:16px;font-weight:600;border:1px solid transparent}
.add svg{width:20px;height:20px;stroke:currentColor}
.add.primary{background:var(--accent);color:var(--accent-fg)}
.add.second{background:var(--surface);border-color:var(--line)}

/* lists */
.stack{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;overflow:hidden}
.stack>*{border-bottom:1px solid var(--line)}
.stack>*:last-child{border-bottom:0}
.rowwrap{display:flex;align-items:center;gap:6px}
.rowwrap.withpay{padding-right:12px}
.rowwrap>.row{flex:1;min-width:0;width:auto}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;background:transparent;border:0;text-align:left;width:100%}
.row:active{background:var(--surface-2)}
.row.cancel{opacity:.55}
.row.cancel .row-title{text-decoration:line-through}
.datebox{flex:none;width:48px;padding:5px 0;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.datebox .w,.datebox .mo{font-size:11px;color:var(--muted)}
.datebox .d{font-weight:700;font-size:19px}
.row-body{flex:1;min-width:0}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-amt{flex:none;text-align:right}
.row-amt .a{font-weight:600;font-variant-numeric:tabular-nums}
.row-amt .b{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)}
.c-info{background:var(--info-bg);color:var(--info)} .c-plain{background:var(--surface-2);color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)} .d-info{background:var(--info)} .d-plain{background:var(--muted)}
.paybtn{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.paybtn svg{width:21px;height:21px}
.paybtn:disabled{opacity:.5}
.ask-actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px 74px}
.qbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600}
.qbtn.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.qbtn.no{color:var(--bad)}
.qbtn:disabled{opacity:.5}

/* bolos tab */
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px}
.search:focus{outline:none;border-color:var(--accent)}
.toolbar{display:flex;justify-content:center;margin:12px 0 4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 18px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.calcard{padding:8px 10px 12px;margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:6px}
.cal .hd{font-size:12px;text-align:center;color:var(--muted);padding-bottom:4px}
.cal button{aspect-ratio:1/1;max-width:100%;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;font-weight:500}
.cal button.out{visibility:hidden}
.cal button.today{color:var(--accent);font-weight:700}
.cal button.sel{background:var(--accent);color:var(--accent-fg)}
.cal button:not(.sel):active{background:var(--surface-2)}
.cal .dots{display:flex;gap:2px;height:6px}

/* gastos tab */
.gsum{padding:10px 12px 16px;text-align:center}
.gsum .big{font-size:38px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:8px;line-height:1.1}
.gsum .cap{color:var(--muted);font-size:15px;margin-top:4px}

/* bottom navigation */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabbar-h)}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--muted)}
.tabbar svg{width:22px;height:22px;stroke:currentColor;box-sizing:content-box;border-radius:999px}
.tabbar button[aria-current="page"]{color:var(--fg);font-weight:600}
.tabbar button[aria-current="page"] svg{background:var(--accent-soft);color:var(--accent);padding:4px 18px;margin:-4px 0}
.fab{position:fixed;z-index:21;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom,0px));
  border:0;border-radius:16px;background:var(--accent);color:var(--accent-fg);height:56px;padding:0 20px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.fab svg{width:22px;height:22px;stroke:currentColor}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4)}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in{max-width:600px;margin:0 auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:21px;font-weight:700;margin:0 0 16px}
.sheet h2{margin-top:28px}
.topaction{width:100%;margin:-4px 0 18px;border:0;border-radius:14px;height:50px;font-size:16px;font-weight:600;background:var(--ok-bg);color:var(--ok)}
form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:500;color:var(--muted)}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lblrow a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:16px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field textarea{min-height:72px;resize:vertical}
.field input[type=number]{-moz-appearance:textfield;appearance:textfield}
.field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field input.bigin{font-size:28px;font-weight:700;padding:10px 14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.opts{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.opts label,.tipos label{position:relative}
.opts input,.tipos input{position:absolute;opacity:0;inset:0;margin:0}
.opts span{display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--muted);text-align:center}
.opts input:checked+span.k-warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.opts input:checked+span.k-info{background:var(--info-bg);color:var(--info);border-color:var(--info)}
.opts input:checked+span.k-bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.tipos{display:flex;flex-wrap:wrap;gap:8px}
.tipos span{display:inline-block;padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:15px;font-weight:500}
.tipos input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.opts input:focus-visible+span,.tipos input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--bg);border-radius:12px;font-weight:500}
.switch input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
details.more{border:1px solid var(--line);border-radius:12px}
details.more>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 0}
details.more[open]>summary::after{transform:rotate(-135deg);margin:4px 4px 0 0}
details.more .fields{display:flex;flex-direction:column;gap:14px;padding:2px 14px 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;flex:1}
.btn.wide{width:100%}
.links{display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:center;margin-top:4px}
.links button{border:0;background:none;padding:8px 2px;color:var(--accent);font-weight:600;font-size:15px}
.links button.danger{color:var(--bad)}
.links button.armed{color:#fff;background:var(--bad);border-radius:8px;padding:8px 12px}

.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + 84px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:14px;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.toast button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:0;flex:none}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">Mis Bolos</h1>
    <button class="icon-btn" id="btn-ajustes" type="button" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fab-label">Nuevo bolo</span></button>

  </div>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="sheet-in"><div class="grab"></div><div id="sheet-body"></div></div></section>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const CATS = {transporte:"Gasolina",peaje:"Parking y peajes",dietas:"Comida",alojamiento:"Hotel",material:"Material",cuota:"Autónomos",otros:"Otros"};
const CATS_ANTES = {km:"Kilometraje",formacion:"Formación",gestoria:"Gestoría"};
const catLabel = k => CATS[k]||CATS_ANTES[k]||"Otros";
const DEF_AJUSTES = {plazo:30,irpfOn:false,irpf:15,gcalOn:false,gcalNombre:"Mis Bolos",gcalId:""};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const LS_KEY = "mis-bolos-v1";
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  prev:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- state ---------- */
const S = {bolos:new Map(), gastos:new Map(), empresas:new Map(), ajustes:{...DEF_AJUSTES}, loaded:false, storeKind:"cargando", note:""};
const now = new Date();
const UI = {tab:"inicio", y:now.getFullYear(), m:now.getMonth(), bolosView:"lista", dia:null, q:""};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const TODAY = iso(now);
const parse = s => { const [y,m,d]=String(s).split("-").map(Number); return new Date(y,(m||1)-1,d||1); };
const num = v => { const n=parseFloat(String(v==null?"":v).replace(",",".")); return isFinite(n)?n:0; };
const r2 = n => Math.round((n||0)*100)/100;
const fmtEUR = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:2});
const eur = n => fmtEUR.format(r2(n));
const fmtDate = s => { if(!s) return ""; const d=parse(s); return d.getDate()+" "+MESES[d.getMonth()].slice(0,3)+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():""); };
const daysBetween = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const norm = s => String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const suma = (arr,fn) => arr.reduce((s,x)=>s+fn(x),0);
const plural = (n,uno,varios) => n+" "+(n===1?uno:varios);
const porFecha = (a,b) => a.fecha.localeCompare(b.fecha);

function toast(msg,undo){
  const t=$("#toast"); t.textContent="";
  const s=document.createElement("span"); s.textContent=msg; t.appendChild(s);
  if(undo){ const b=document.createElement("button"); b.type="button"; b.textContent="Deshacer"; b.addEventListener("click",()=>{ t.hidden=true; undo(); }); t.appendChild(b); }
  t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,undo?6500:2600);
}

/* ---------- domain ---------- */
const bolosArr = () => [...S.bolos.entries()].map(([id,b])=>({...b,id})).filter(b=>typeof b.fecha==="string"&&b.fecha);
const gastosArr = () => [...S.gastos.entries()].map(([id,g])=>({...g,id})).filter(g=>typeof g.fecha==="string"&&g.fecha);
/* older entries may carry a per-day price or extras; the form now keeps one total price */
const importe = b => (b.tipoPrecio==="jornada" ? num(b.precio)*Math.max(num(b.jornadas)||1,0) : num(b.precio)) + num(b.extras);
const esReserva = b => b.estado==="posible" || b.estado==="reserva";
const activo = b => b.estado==="confirmado" || b.estado==="realizado";
const finDe = b => b.fechaFin && b.fechaFin>=b.fecha ? b.fechaFin : b.fecha;
/* a confirmed gig counts as done once its last day has passed */
const hecho = b => activo(b) && (b.estado==="realizado" || finDe(b)<TODAY);
const pagado = b => b.pago==="pagado";
const cobradoDe = b => pagado(b) ? importe(b) : b.pago==="parcial" ? Math.min(num(b.cobrado),importe(b)) : 0;
const deudaDe = b => hecho(b) ? Math.max(importe(b)-cobradoDe(b),0) : 0;
const diasDesde = b => daysBetween(finDe(b),TODAY);
const atrasado = b => deudaDe(b)>0 && diasDesde(b) > (num(S.ajustes.plazo)||30);
const reservaPasada = b => esReserva(b) && finDe(b)<TODAY;
const gastosDe = id => gastosArr().filter(g=>g.boloId===id);
const tituloDe = b => b.evento||b.empresa||"Bolo";
const enMes = s => typeof s==="string" && s.startsWith(UI.y+"-"+pad(UI.m+1));
const mesActual = () => UI.y===now.getFullYear() && UI.m===now.getMonth();
const mesPasado = () => UI.y<now.getFullYear() || (UI.y===now.getFullYear() && UI.m<now.getMonth());
function estadoDe(b){
  if(b.estado==="cancelado") return ["Cancelado","plain"];
  if(esReserva(b)) return finDe(b)<TODAY ? ["¿Se hizo?","warn"] : ["En reserva","warn"];
  if(!hecho(b)) return ["Confirmado","info"];
  if(pagado(b)) return ["Cobrado","ok"];
  if(atrasado(b)) return ["Sin cobrar · "+diasDesde(b)+" días","bad"];
  if(b.pago==="parcial") return ["Cobrado en parte","warn"];
  return ["Sin cobrar","warn"];
}
const estadoTxt = b => b.estado==="cancelado" ? "Cancelado" : esReserva(b) ? "En reserva" : hecho(b) ? "Hecho" : "Confirmado";
function empresas(){ const m=new Map(); bolosArr().forEach(b=>{ const e=String(b.empresa||"").trim(); if(e && !m.has(norm(e))) m.set(norm(e),e); }); return [...m.values()].sort((a,b)=>a.localeCompare(b,"es")); }
function lugares(){ const s=new Set(); bolosArr().forEach(b=>b.lugar&&s.add(b.lugar)); return [...s].sort((a,b)=>a.localeCompare(b,"es")); }
function ultimoDe(empresa){
  const k=norm(empresa); if(!k) return null;
  return bolosArr().filter(b=>b.empresa && norm(b.empresa)===k && importe(b)>0).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]||null;
}
function solapes(fecha,fin,exceptId){
  if(!fecha) return [];
  const f2 = fin && fin>=fecha ? fin : fecha;
  return bolosArr().filter(b=>b.id!==exceptId && b.estado!=="cancelado" && b.fecha<=f2 && finDe(b)>=fecha);
}

/* ---------- storage: artifact db, or this device as fallback ---------- */
const Store = {
  db:null,
  async init(){
    let db=null;
    try{ db = (window.claude && typeof window.claude.use==="function") ? await window.claude.use("db") : null; }catch(e){ db=null; }
    if(db){ this.db=db; S.storeKind="nube"; this.subscribe(); }
    else { S.storeKind="local"; this.loadLocal(); S.loaded=true; render(); }
  },
  subscribe(){
    const pending = new Set(["bolos","gastos","empresas","ajustes"]);
    const timer = setTimeout(()=>{ if(pending.size){ S.note="Los datos tardan en llegar. Revisa la conexión; se cargarán solos."; renderBanner(); } },10000);
    const done = (k,fromCache)=>{ if(!fromCache){ pending.delete(k); if(!pending.size){ clearTimeout(timer); if(S.note.startsWith("Los datos")) S.note=""; } } S.loaded=true; render(); };
    const onErr = e => { clearTimeout(timer); S.note = e && e.code==="revoked" ? "Ya no hay acceso a los datos en esta vista." : "No se pudieron cargar los datos ("+(e&&e.code||"error")+"). Cierra y vuelve a abrir la app."; S.loaded=true; render(); };
    ["bolos","gastos","empresas"].forEach(col=>{
      this.db.collection(col).onSnapshot(snap=>{
        S[col] = new Map(snap.docs.map(d=>[d.id,d.data()]));
        done(col,snap.metadata.fromCache);
      },onErr);
    });
    this.db.doc("ajustes/general").onSnapshot(s=>{
      S.ajustes = {...DEF_AJUSTES,...(s.exists?s.data():{})};
      done("ajustes",s.metadata.fromCache);
    },onErr);
  },
  loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      if(raw){ const o=JSON.parse(raw);
        S.bolos=new Map(Object.entries(o.bolos||{})); S.gastos=new Map(Object.entries(o.gastos||{}));
        S.empresas=new Map(Object.entries(o.empresas||{})); S.ajustes={...DEF_AJUSTES,...(o.ajustes||{})}; }
    }catch(e){}
  },
  saveLocal(){
    try{ localStorage.setItem(LS_KEY,JSON.stringify({bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes})); }
    catch(e){ toast("No se pudo guardar en este dispositivo"); }
  },
  async put(col,id,data){
    if(this.db){
      try{ if(col==="ajustes") await this.db.doc("ajustes/general").set(data); else await this.db.collection(col).doc(id).set(data); return true; }
      catch(e){ toast(e&&e.code==="quota_exceeded" ? "Sin espacio: borra registros antiguos" : "No se pudo guardar. Inténtalo otra vez"); return false; }
    }
    if(col==="ajustes") S.ajustes={...DEF_AJUSTES,...data}; else S[col].set(id,data);
    this.saveLocal(); render(); return true;
  },
  async del(col,id){
    if(this.db){ try{ await this.db.collection(col).doc(id).delete(); return true; }catch(e){ toast("No se pudo borrar"); return false; } }
    S[col].delete(id); this.saveLocal(); render(); return true;
  }
};

/* ---------- Google Calendar (separate calendar, chosen by name) ---------- */
const GC_SERVER = "Google Calendar";
const GC_FATAL = ["server_not_connected","needs_reauth","not_in_manifest","approval_required","blocked_by_policy","not_granted","consent_required"];
const GCal = {
  mcp:null,
  async get(){ if(this.mcp) return this.mcp; try{ this.mcp = window.claude ? await window.claude.use("mcp") : null; }catch(e){ this.mcp=null; } return this.mcp; },
  enabled(){ return !!(S.ajustes.gcalOn && S.ajustes.gcalId); },
  errText(e){
    const c=e&&e.code;
    if(c==="server_not_connected") return "Google Calendar no está conectado en tu cuenta de Claude (Ajustes → Conectores).";
    if(c==="needs_reauth") return "Vuelve a conectar Google Calendar en Ajustes de Claude → Conectores.";
    if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required") return "Falta tu permiso para que la app use Google Calendar. Vuelve a intentarlo y pulsa Permitir.";
    if(c==="blocked_by_policy") return "Tu organización no permite usar Google Calendar aquí.";
    if(c==="server_unavailable") return "Google Calendar no responde ahora. Inténtalo en un rato.";
    if(c==="not_granted") return "Esta vista no puede usar Google Calendar. Abre la app desde Claude.";
    return "No se pudo actualizar Google Calendar"+(c?" ("+c+")":"")+".";
  },
  async call(tool,input){ const m=await this.get(); if(!m) throw {code:"not_granted"}; const r=await m.callTool(GC_SERVER,tool,input); return r ? r.payload : null; },
  async findCalendar(nombre){
    const p=await this.call("list_calendars",{pageSize:250});
    const list=(p&&(p.calendars||p.items))||[];
    const want=String(nombre||"").trim().toLowerCase();
    const hit=list.find(c=>String(c.summary||"").trim().toLowerCase()===want);
    return hit ? hit.id : "";
  },
  addDay(s){ const d=parse(s); d.setDate(d.getDate()+1); return iso(d); },
  eventFor(b){
    const res=esReserva(b);
    const titulo=(res?"[Reserva] ":"")+tituloDe(b)+(b.evento&&b.empresa?" · "+b.empresa:"");
    const lines=[b.empresa&&"Empresa: "+b.empresa,b.lugar&&"Lugar: "+b.lugar,importe(b)?"Precio: "+eur(importe(b)):"",
      "Estado: "+estadoTxt(b),b.notas&&"Notas: "+b.notas,"Apuntado en Mis Bolos"].filter(Boolean);
    const ev={calendarId:S.ajustes.gcalId,summary:titulo,description:lines.map(esc).join("<br>"),location:b.lugar||"",colorId:res?"5":"9",notificationLevel:"NONE"};
    const fin=finDe(b);
    if(b.hora){
      ev.startTime=b.fecha+"T"+b.hora+":00";
      if(fin>b.fecha) ev.endTime=fin+"T23:59:00";
      else { const [h,m]=b.hora.split(":").map(Number); ev.endTime=b.fecha+"T"+(h+8>23?"23:59":pad(h+8)+":"+pad(m))+":00"; }
    } else { ev.allDay=true; ev.startTime=b.fecha+"T00:00:00"; ev.endTime=this.addDay(fin)+"T00:00:00"; }
    return ev;
  },
  idFrom(p){ if(!p) return ""; if(typeof p==="string"){ const m=p.match(/"id"\s*:\s*"([^"]+)"/); return m?m[1]:""; } return p.id||p.eventId||(p.event&&p.event.id)||""; },
  /* returns the event id to keep on the gig ("" when none) */
  async sync(b){
    if(!this.enabled()) return b.gcalId||"";
    if(b.estado==="cancelado" || b._borrado){
      if(b.gcalId){ try{ await this.call("delete_event",{calendarId:S.ajustes.gcalId,eventId:b.gcalId,notificationLevel:"NONE"}); }catch(e){ if(!e||e.code!=="tool_error") throw e; } }
      return "";
    }
    const ev=this.eventFor(b);
    if(b.gcalId){
      try{ await this.call("update_event",{...ev,eventId:b.gcalId}); return b.gcalId; }
      catch(e){ if(!e||e.code!=="tool_error") throw e; /* the event was removed by hand: create it again */ }
    }
    return this.idFrom(await this.call("create_event",ev));
  },
  async after(id,b){
    if(!this.enabled()) return;
    try{
      const gid=await this.sync(b);
      if(!b._borrado && gid!==(b.gcalId||"")){ const cur=S.bolos.get(id); if(cur) await Store.put("bolos",id,{...cur,gcalId:gid}); }
    }catch(e){ toast(this.errText(e)); }
  },
  async syncAll(onProgress){
    const all=bolosArr().filter(b=>b.estado!=="cancelado"||b.gcalId);
    let n=0, fails=0, lastErr=null;
    for(const b of all){
      try{ const gid=await this.sync(b); if(gid!==(b.gcalId||"")){ const cur=S.bolos.get(b.id); if(cur) await Store.put("bolos",b.id,{...cur,gcalId:gid}); } n++; }
      catch(e){ fails++; lastErr=e; if(e&&GC_FATAL.includes(e.code)) break; }
      if(onProgress) onProgress(n,all.length);
    }
    return {n,fails,lastErr,total:all.length};
  }
};

/* ---------- one-tap changes, with undo ---------- */
async function quick(id,accion){
  const b=S.bolos.get(id); if(!b) return;
  const o={...b,actualizado:new Date().toISOString()}; let msg="";
  if(accion==="confirmar"){ o.estado="confirmado"; msg="Bolo confirmado"; }
  else if(accion==="hecho"){ o.estado="realizado"; msg="Apuntado como hecho"; }
  else if(accion==="cancelar"){ o.estado="cancelado"; msg="Bolo cancelado"; }
  else if(accion==="cobrado"){ o.pago="pagado"; o.cobrado=importe(b); o.fechaCobro=TODAY; msg="Cobrado: "+eur(importe(b)); }
  else return;
  if(!(await Store.put("bolos",id,o))) return;
  if(o.estado!==b.estado) GCal.after(id,o);
  toast(msg,async()=>{
    const cur=S.bolos.get(id)||o, back={...b};
    if("gcalId" in cur) back.gcalId=cur.gcalId;
    if(await Store.put("bolos",id,back)){ toast("Deshecho"); if(back.estado!==o.estado) GCal.after(id,back); }
  });
}
const qbtn = (id,accion,label,cls) => `<button class="qbtn ${cls||""}" type="button" data-quick="${id}|${accion}">${label}</button>`;

/* ---------- render ---------- */
function renderBanner(){
  const b=$("#banner");
  if(S.note){ b.innerHTML='<div class="banner warn">'+esc(S.note)+'</div>'; return; }
  if(S.storeKind==="local"){ b.innerHTML='<div class="banner">Guardando solo en este dispositivo. Haz copias desde Ajustes.</div>'; return; }
  b.innerHTML="";
}
function render(){
  document.querySelectorAll(".tabbar button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===UI.tab?"page":"false"));
  $("#fab").hidden = UI.tab==="inicio";
  $("#fab-label").textContent = UI.tab==="gastos" ? "Nuevo gasto" : "Nuevo bolo";
  renderBanner();
  const v=$("#view");
  if(!S.loaded){ v.innerHTML='<div class="empty"><strong>Cargando tus bolos…</strong>Un momento.</div>'; return; }
  const ae=document.activeElement, keep = ae && ae.id==="q" ? [ae.selectionStart,ae.selectionEnd] : null;
  v.innerHTML = UI.tab==="bolos" ? vBolos() : UI.tab==="gastos" ? vGastos() : vInicio();
  if(keep){ const q=$("#q"); if(q){ q.focus(); try{ q.setSelectionRange(keep[0],keep[1]); }catch(e){} } }
}

function mnav(){
  return `<div class="mnav"><button class="icon-btn" type="button" data-mes="-1" aria-label="Mes anterior">${ICON.prev}</button>
    <div class="mid"><div class="label">${cap(MESES[UI.m])} ${UI.y}</div>${mesActual()?"":'<button class="back" type="button" data-mes="0">Volver a hoy</button>'}</div>
    <button class="icon-btn" type="button" data-mes="1" aria-label="Mes siguiente">${ICON.next}</button></div>`;
}
function datebox(fecha){
  const d=parse(fecha), y=d.getFullYear()!==now.getFullYear() ? " "+String(d.getFullYear()).slice(2) : "";
  return `<div class="datebox"><span class="w">${DIAS[d.getDay()]}</span><span class="d">${d.getDate()}</span><span class="mo">${MESES[d.getMonth()].slice(0,3)}${y}</span></div>`;
}
function row(b,o={}){
  let [lab,cls]=estadoDe(b);
  if(o.deuda){ const n=diasDesde(b); lab = n<=0 ? "Hoy" : n===1 ? "Ayer" : "Hace "+n+" días"; cls = atrasado(b) ? "bad" : "plain"; }
  const fin=finDe(b), debe=deudaDe(b), conPago = o.pay && debe>0;
  const sub=[b.evento?b.empresa:"", b.lugar, fin>b.fecha?"hasta el "+fmtDate(fin):"", b.hora].filter(Boolean).join(" · ");
  return `<div class="rowwrap${conPago?" withpay":""}"><button class="row${b.estado==="cancelado"?" cancel":""}" type="button" data-bolo="${b.id}">
    ${datebox(b.fecha)}
    <div class="row-body"><div class="row-title">${esc(tituloDe(b))}</div>${sub?`<div class="row-sub">${esc(sub)}</div>`:""}<div class="chips"><span class="chip c-${cls}">${esc(lab)}</span></div></div>
    <div class="row-amt"><div class="a">${eur(importe(b))}</div>${b.pago==="parcial"&&debe>0?`<div class="b">faltan ${eur(debe)}</div>`:""}</div>
  </button>${conPago?`<button class="paybtn" type="button" data-quick="${b.id}|cobrado" aria-label="Me han pagado ${esc(tituloDe(b))}">${ICON.check}</button>`:""}</div>`;
}

function vInicio(){
  const A=S.ajustes, all=bolosArr();
  const delMes=all.filter(b=>enMes(b.fecha)), act=delMes.filter(activo);
  const ganar=suma(act,importe);
  const gastos=suma(gastosArr().filter(g=>enMes(g.fecha)),g=>num(g.importe));
  const resImp=suma(delMes.filter(b=>esReserva(b)&&finDe(b)>=TODAY),importe);
  const donde = mesActual() ? "este mes" : "en "+MESES[UI.m];
  const capTxt = mesActual() ? "Este mes vas a ganar" : mesPasado() ? "En "+MESES[UI.m]+" ganaste" : "En "+MESES[UI.m]+" vas a ganar";
  const lines=[];
  if(act.length) lines.push("en "+plural(act.length,"bolo","bolos"));
  else lines.push(mesPasado() ? "No tuviste bolos "+donde+"." : "Aún no tienes bolos confirmados "+donde+".");
  const irpf = A.irpfOn ? ganar*num(A.irpf)/100 : 0;
  if(ganar && (gastos||irpf)){
    const quita=[gastos?eur(gastos)+" de gastos":"", irpf?eur(irpf)+" de IRPF":""].filter(Boolean).join(" y ");
    lines.push(`Te quedan <strong>${eur(ganar-gastos-irpf)}</strong> quitando ${quita}.`);
  } else if(gastos) lines.push(`Gastos: <strong>${eur(gastos)}</strong>.`);
  if(resImp) lines.push(act.length ? `Y <strong>${eur(resImp)}</strong> más en reserva, si se confirman.` : `Tienes <strong>${eur(resImp)}</strong> en reserva, si se confirman.`);
  const anio=all.filter(b=>activo(b)&&b.fecha.startsWith(UI.y+"-"));

  let h=`<div class="card sum">${mnav()}<div class="cap">${capTxt}</div><div class="big">${eur(ganar)}</div>
    <div class="lines">${lines.map(l=>`<div>${l}</div>`).join("")}</div>
    ${anio.length?`<div class="year">Todo ${UI.y}: <strong>${eur(suma(anio,importe))}</strong> en ${plural(anio.length,"bolo","bolos")}</div>`:""}</div>
  <div class="adds"><button class="add primary" type="button" data-add="bolo">${ICON.plus}Nuevo bolo</button><button class="add second" type="button" data-add="gasto">${ICON.plus}Nuevo gasto</button></div>`;

  if(!all.length) return h+`<div class="empty" style="margin-top:16px"><strong>Empieza apuntando un bolo</strong>Con la empresa, la fecha y el precio basta. Lo demás es opcional.</div>`;

  const deben=all.filter(b=>deudaDe(b)>0).sort(porFecha);
  h+=`<h2><span>Te deben</span>${deben.length?`<span class="num">${eur(suma(deben,deudaDe))}</span>`:""}</h2>`;
  h+= deben.length
    ? `<div class="stack">${deben.map(b=>row(b,{pay:true,deuda:true})).join("")}</div><p class="hint" style="margin:8px 4px 0">Toca ✓ cuando te paguen.</p>`
    : `<div class="note">No te deben nada.</div>`;

  const rp=all.filter(reservaPasada).sort(porFecha);
  if(rp.length) h+=`<h2><span>¿Se hicieron?</span></h2><div class="stack">${rp.map(b=>`<div>${row(b)}<div class="ask-actions">${qbtn(b.id,"hecho","Sí, se hizo","ok")}${qbtn(b.id,"cancelar","No salió","no")}</div></div>`).join("")}</div>`;

  const fut=all.filter(b=>finDe(b)>=TODAY && b.estado!=="cancelado").sort(porFecha);
  h+=`<h2><span>Próximos bolos</span>${fut.length>5?'<button class="link" type="button" data-tab="bolos">Ver todos</button>':""}</h2>`;
  h+= fut.length ? `<div class="stack">${fut.slice(0,5).map(b=>row(b)).join("")}</div>` : `<div class="note">No tienes bolos apuntados desde hoy.</div>`;
  return h;
}

function vBolos(){
  return `<input class="search" id="q" type="search" placeholder="Buscar empresa, evento o lugar" value="${esc(UI.q)}" aria-label="Buscar bolos" autocomplete="off">
  <div class="toolbar"><div class="seg" role="group" aria-label="Vista"><button type="button" data-bview="lista" aria-pressed="${UI.bolosView==="lista"}">Lista</button><button type="button" data-bview="cal" aria-pressed="${UI.bolosView==="cal"}">Calendario</button></div></div>
  <div id="bolos-body">${bolosBody()}</div>`;
}
function bolosBody(){
  const all=bolosArr();
  if(UI.q.trim()){
    const q=norm(UI.q);
    const bs=all.filter(b=>norm([b.evento,b.empresa,b.lugar,b.notas].join(" ")).includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    if(!bs.length) return `<div class="empty" style="margin-top:8px"><strong>Sin resultados</strong>No hay ningún bolo con «${esc(UI.q.trim())}».</div>`;
    return `<h2><span>${plural(bs.length,"resultado","resultados")}</span><span class="num">${eur(suma(bs.filter(activo),importe))}</span></h2><div class="stack">${bs.slice(0,100).map(b=>row(b)).join("")}</div>`;
  }
  if(UI.bolosView==="cal") return calendario(all);
  if(!all.length) return `<div class="empty" style="margin-top:8px"><strong>Aún no hay bolos</strong>Pulsa «Nuevo bolo» y apunta empresa, fecha y precio.</div>`;
  const fut=all.filter(b=>finDe(b)>=TODAY).sort(porFecha);
  const pas=all.filter(b=>finDe(b)<TODAY).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  let h="";
  if(fut.length) h+=`<h2><span>Próximos</span><span class="num">${eur(suma(fut.filter(activo),importe))}</span></h2><div class="stack">${fut.map(b=>row(b)).join("")}</div>`;
  const groups=new Map();
  pas.forEach(b=>{ const k=b.fecha.slice(0,7); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(b); });
  groups.forEach((arr,k)=>{
    const y=Number(k.slice(0,4)), m=Number(k.slice(5,7));
    h+=`<h2><span>${cap(MESES[m-1])}${y!==now.getFullYear()?" "+y:""}</span><span class="num">${eur(suma(arr.filter(activo),importe))}</span></h2><div class="stack">${arr.map(b=>row(b)).join("")}</div>`;
  });
  return h;
}
function calendario(all){
  const first=new Date(UI.y,UI.m,1), start=(first.getDay()+6)%7, n=new Date(UI.y,UI.m+1,0).getDate();
  let h=`<div class="card calcard">${mnav()}<div class="cal">`+["L","M","X","J","V","S","D"].map(d=>`<div class="hd">${d}</div>`).join("");
  for(let i=0;i<start;i++) h+='<button class="out" type="button" tabindex="-1" aria-hidden="true"></button>';
  for(let d=1; d<=n; d++){
    const ds=UI.y+"-"+pad(UI.m+1)+"-"+pad(d), on=all.filter(b=>b.fecha<=ds && finDe(b)>=ds);
    h+=`<button type="button" data-dia="${ds}" class="${ds===TODAY?"today ":""}${ds===UI.dia?"sel":""}" aria-label="${d} de ${MESES[UI.m]}${on.length?", "+plural(on.length,"bolo","bolos"):""}">${d}<span class="dots">${on.slice(0,3).map(b=>`<i class="dot d-${estadoDe(b)[1]}"></i>`).join("")}</span></button>`;
  }
  h+='</div></div>';
  if(UI.dia && enMes(UI.dia)){
    const dd=all.filter(b=>b.fecha<=UI.dia && finDe(b)>=UI.dia);
    h+=`<h2><span>${cap(DIAS[parse(UI.dia).getDay()])} ${fmtDate(UI.dia)}</span></h2>${dd.length?`<div class="stack">${dd.map(b=>row(b)).join("")}</div>`:'<div class="note">Día libre.</div>'}
      <div class="actions" style="margin-top:10px"><button class="btn wide" type="button" data-nuevo-dia="${UI.dia}">Apuntar un bolo este día</button></div>`;
  } else h+='<p class="hint" style="text-align:center;margin-top:10px">Toca un día para ver qué tienes o apuntar un bolo.</p>';
  return h;
}

function gRow(g){
  const b=g.boloId?S.bolos.get(g.boloId):null;
  const sub=[g.concepto?catLabel(g.categoria):"", b?tituloDe(b):""].filter(Boolean).join(" · ");
  return `<button class="row" type="button" data-gasto="${g.id}">${datebox(g.fecha)}
    <div class="row-body"><div class="row-title">${esc(g.concepto||catLabel(g.categoria))}</div>${sub?`<div class="row-sub">${esc(sub)}</div>`:""}</div>
    <div class="row-amt"><div class="a">${eur(num(g.importe))}</div></div></button>`;
}
function vGastos(){
  const gs=gastosArr().filter(g=>enMes(g.fecha)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const tot=suma(gs,g=>num(g.importe));
  let h=`<div class="card gsum">${mnav()}<div class="big">${eur(tot)}</div><div class="cap">${gs.length?"gastado en "+plural(gs.length,"apunte","apuntes"):"Sin gastos "+(mesActual()?"este mes":"en "+MESES[UI.m])}</div></div>`;
  if(gs.length) h+=`<div class="stack" style="margin-top:12px">${gs.map(gRow).join("")}</div>`;
  return h;
}

/* ---------- sheets ---------- */
function openSheet(html,onReady){
  $("#sheet-body").innerHTML=html; $("#sheet").hidden=false; $("#backdrop").hidden=false;
  document.body.style.overflow="hidden"; $("#sheet").scrollTop=0;
  if(onReady) onReady($("#sheet-body"));
}
function closeSheet(){ $("#sheet").hidden=true; $("#backdrop").hidden=true; document.body.style.overflow=""; $("#sheet-body").innerHTML=""; }
$("#backdrop").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#sheet").hidden) closeSheet(); });
const opt = (v,l,sel) => `<option value="${esc(v)}"${String(v)===String(sel==null?"":sel)?" selected":""}>${esc(l)}</option>`;
const datalist = (id,arr) => `<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}"></option>`).join("")}</datalist>`;
function armDelete(btn,fn){
  const txt=btn.textContent;
  btn.addEventListener("click",()=>{
    if(btn.classList.contains("armed")){ fn(); return; }
    btn.classList.add("armed"); btn.textContent="Toca otra vez para borrar";
    setTimeout(()=>{ if(btn.isConnected){ btn.classList.remove("armed"); btn.textContent=txt; } },4000);
  });
}

function boloForm(id,preset){
  const nuevo=!id, src=id?S.bolos.get(id):null;
  if(id && !src) return;
  const b = id ? {...src,id} : {fecha:TODAY,estado:"confirmado",...(preset||{})};
  const est = b.estado==="cancelado" ? "cancelado" : esReserva(b) ? "reserva" : "confirmado";
  const opciones=[["reserva","En reserva","warn"],["confirmado","Confirmado","info"]].concat(nuevo?[]:[["cancelado","Cancelado","bad"]]);
  const pv=r2(importe(b)), verMas=!!(b.evento||b.fechaFin||b.hora||b.notas);
  const gs=id?gastosDe(id):[], gtot=suma(gs,g=>num(g.importe));
  const mapa = b.lugar ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.lugar)}" target="_blank" rel="noopener">Cómo llegar</a>` : "";
  const html=`<h3>${nuevo?"Nuevo bolo":"Editar bolo"}</h3>
  ${!nuevo&&esReserva(b)?`<button class="topaction" type="button" data-quick="${id}|confirmar">Confirmar bolo</button>`:""}
  <form id="f-bolo" autocomplete="off" novalidate>
    <div class="field"><label for="b-empresa">Empresa</label><input id="b-empresa" name="empresa" list="dl-emp" value="${esc(b.empresa)}" placeholder="Quién te contrata" autocapitalize="words"><span class="hint" id="b-emp-hint" hidden></span></div>${datalist("dl-emp",empresas())}
    <div class="two">
      <div class="field"><label for="b-fecha">Fecha</label><input id="b-fecha" type="date" name="fecha" value="${esc(b.fecha)}"></div>
      <div class="field"><label for="b-precio">Precio (€)</label><input id="b-precio" type="number" inputmode="decimal" step="0.01" min="0" name="precio" value="${pv||""}" placeholder="0"></div>
    </div>
    <span class="hint warn" id="b-solape" hidden></span>
    <div class="field"><div class="lblrow"><label for="b-lugar">Lugar</label>${mapa}</div><input id="b-lugar" name="lugar" list="dl-lug" value="${esc(b.lugar)}" placeholder="Opcional"></div>${datalist("dl-lug",lugares())}
    <div class="field"><span class="lbl">Estado</span><div class="opts">${opciones.map(([k,l,c])=>`<label><input type="radio" name="estado" value="${k}"${est===k?" checked":""}><span class="k-${c}">${l}</span></label>`).join("")}</div></div>
    ${nuevo?"":`<label class="switch" id="b-cobrado-wrap"><span>Ya me lo han pagado${b.pago==="parcial"?`<br><span class="hint">Apuntado como cobrado en parte (${eur(cobradoDe(b))})</span>`:""}</span><input type="checkbox" name="pagado"${pagado(b)?" checked":""}></label>`}
    <details class="more"${verMas?" open":""}><summary>Más detalles</summary><div class="fields">
      <div class="field"><label for="b-evento">Nombre del evento</label><input id="b-evento" name="evento" value="${esc(b.evento)}" placeholder="Concierto, feria, gala…"></div>
      <div class="two"><div class="field"><label for="b-fin">Hasta (varios días)</label><input id="b-fin" type="date" name="fechaFin" value="${esc(b.fechaFin)}"></div>
        <div class="field"><label for="b-hora">Hora de citación</label><input id="b-hora" type="time" name="hora" value="${esc(b.hora)}"></div></div>
      <div class="field"><label for="b-notas">Notas</label><textarea id="b-notas" name="notas" placeholder="Contacto, material, horarios…">${esc(b.notas)}</textarea></div>
    </div></details>
    ${gs.length?`<p class="hint" style="margin:0">Gastos de este bolo: ${eur(gtot)}. Te deja <strong>${eur(importe(b)-gtot)}</strong>.</p>`:""}
    <div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="b-cancel">Cancelar</button></div>
    ${nuevo?"":`<div class="links"><button type="button" id="b-gasto">Añadir gasto</button><button type="button" id="b-dup">Duplicar</button><button type="button" class="danger" id="b-del">Borrar</button></div>`}
  </form>`;
  openSheet(html,root=>{
    const f=root.querySelector("#f-bolo"), wrapCob=root.querySelector("#b-cobrado-wrap");
    const elEstado=()=>{ const c=f.querySelector('input[name="estado"]:checked'); return c?c.value:"confirmado"; };
    const syncEstado=()=>{ if(wrapCob) wrapCob.hidden = elEstado()!=="confirmado"; };
    const solape=()=>{
      const xs=solapes(f.fecha.value,f.fechaFin.value,id), el=root.querySelector("#b-solape");
      el.hidden=!xs.length;
      if(xs.length) el.textContent="Ojo: ese día ya tienes "+xs.map(x=>tituloDe(x)+(esReserva(x)?" (en reserva)":"")).join(" y ")+".";
    };
    syncEstado(); solape();
    f.addEventListener("change",e=>{ const n=e.target.name; if(n==="estado") syncEstado(); if(n==="fecha"||n==="fechaFin") solape(); });
    /* a new gig for a known company starts from the price agreed last time */
    if(nuevo) f.empresa.addEventListener("change",()=>{
      const u=ultimoDe(f.empresa.value), hint=root.querySelector("#b-emp-hint");
      if(!u || f.precio.value){ hint.hidden=true; return; }
      f.precio.value=r2(importe(u));
      hint.textContent="Precio de la última vez con "+u.empresa+". Cámbialo si esta vez es distinto.";
      hint.hidden=false;
    });
    root.querySelector("#b-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f), val=k=>String(fd.get(k)||"").trim();
      const o = nuevo ? {} : {...(S.bolos.get(id)||src)};
      delete o.id;
      ["empresa","fecha","lugar","evento","fechaFin","hora","notas"].forEach(k=>o[k]=val(k));
      if(!o.fecha){ toast("Pon la fecha"); f.fecha.focus(); return; }
      if(!o.empresa && !o.evento){ toast("Pon la empresa"); f.empresa.focus(); return; }
      if(o.fechaFin && o.fechaFin<=o.fecha) o.fechaFin="";
      const precio=num(fd.get("precio"));
      if(nuevo || Math.round(precio*100)!==Math.round(importe(src)*100)){ o.precio=precio; o.tipoPrecio="total"; o.extras=0; }
      if(o.tipoPrecio!=="jornada") o.jornadas = o.fechaFin ? daysBetween(o.fecha,o.fechaFin)+1 : 1;
      const est=elEstado();
      if(est==="confirmado"){ if(!activo(o)) o.estado="confirmado"; } else o.estado=est;
      if(nuevo){ o.pago="pendiente"; o.cobrado=0; o.creado=new Date().toISOString(); }
      else {
        const quiere=!!fd.get("pagado");
        if(quiere!==pagado(src)){ o.pago=quiere?"pagado":"pendiente"; o.cobrado=quiere?importe(o):0; o.fechaCobro=quiere?(src.fechaCobro||TODAY):""; }
      }
      o.actualizado=new Date().toISOString();
      const bid=id||newId();
      if(await Store.put("bolos",bid,o)){ closeSheet(); toast(nuevo?"Bolo apuntado":"Guardado"); GCal.after(bid,o); }
    });
    if(!nuevo){
      root.querySelector("#b-gasto").addEventListener("click",()=>gastoForm(null,{boloId:id,fecha:b.fecha}));
      root.querySelector("#b-dup").addEventListener("click",()=>{
        const c={...src}; ["gcalId","pago","cobrado","fechaCobro","factura","facturada","creado","actualizado"].forEach(k=>delete c[k]);
        c.estado="confirmado"; boloForm(null,c); toast("Copia lista: cambia la fecha y guarda");
      });
      armDelete(root.querySelector("#b-del"),async()=>{ if(await Store.del("bolos",id)){ closeSheet(); toast("Bolo borrado"); if(src.gcalId) GCal.after(id,{...src,_borrado:true}); } });
    }
  });
}

function gastoForm(id,preset){
  const src=id?S.gastos.get(id):null;
  if(id && !src) return;
  const g = id ? {...src} : {fecha:TODAY,categoria:"transporte",...(preset||{})};
  const tipos=Object.entries(CATS); if(g.categoria && !CATS[g.categoria]) tipos.push([g.categoria,catLabel(g.categoria)]);
  const bs=bolosArr().filter(b=>b.estado!=="cancelado"||b.id===g.boloId).sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,80);
  const html=`<h3>${id?"Editar gasto":"Nuevo gasto"}</h3><form id="f-gasto" autocomplete="off" novalidate>
    <div class="field"><label for="g-importe">Importe (€)</label><input id="g-importe" class="bigin" type="number" inputmode="decimal" step="0.01" min="0" name="importe" value="${num(g.importe)?r2(num(g.importe)):""}" placeholder="0"></div>
    <div class="field"><span class="lbl">¿De qué?</span><div class="tipos">${tipos.map(([k,l])=>`<label><input type="radio" name="categoria" value="${k}"${g.categoria===k?" checked":""}><span>${esc(l)}</span></label>`).join("")}</div></div>
    <div class="two"><div class="field"><label for="g-fecha">Fecha</label><input id="g-fecha" type="date" name="fecha" value="${esc(g.fecha)}"></div>
      <div class="field"><label for="g-bolo">Bolo</label><select id="g-bolo" name="boloId">${opt("","Ninguno",g.boloId||"")}${bs.map(b=>opt(b.id,fmtDate(b.fecha)+" · "+tituloDe(b),g.boloId)).join("")}</select></div></div>
    <div class="field"><label for="g-nota">Nota</label><input id="g-nota" name="concepto" value="${esc(g.concepto)}" placeholder="Opcional"></div>
    <div class="actions"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="g-cancel">Cancelar</button></div>
    ${id?'<div class="links"><button type="button" class="danger" id="g-del">Borrar</button></div>':""}
  </form>`;
  openSheet(html,root=>{
    const f=root.querySelector("#f-gasto");
    /* link the expense to the gig on that day, unless the user picks one */
    let elegido=!!(id||g.boloId);
    const auto=()=>{ if(elegido) return; const xs=bs.filter(b=>b.fecha<=f.fecha.value && finDe(b)>=f.fecha.value); f.boloId.value = xs.length===1 ? xs[0].id : ""; };
    auto();
    f.fecha.addEventListener("change",auto);
    f.boloId.addEventListener("change",()=>{ elegido=true; });
    if(!id){ try{ f.importe.focus({preventScroll:true}); }catch(e){} }
    root.querySelector("#g-cancel").addEventListener("click",closeSheet);
    f.addEventListener("submit",async e=>{
      e.preventDefault();
      const fd=new FormData(f), o = id ? {...src} : {};
      o.importe=num(fd.get("importe")); o.categoria=String(fd.get("categoria")||"otros"); o.fecha=String(fd.get("fecha")||"");
      o.boloId=String(fd.get("boloId")||""); o.concepto=String(fd.get("concepto")||"").trim();
      if(!o.importe){ toast("Pon el importe"); f.importe.focus(); return; }
      if(!o.fecha){ toast("Pon la fecha"); return; }
      if(o.categoria!=="km") o.km=0;
      o.actualizado=new Date().toISOString();
      if(await Store.put("gastos",id||newId(),o)){ closeSheet(); toast(id?"Guardado":"Gasto apuntado: "+eur(o.importe)); }
    });
    if(id) armDelete(root.querySelector("#g-del"),async()=>{ if(await Store.del("gastos",id)){ closeSheet(); toast("Gasto borrado"); } });
  });
}

    <div class="card" style="padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)">
      <p class="small" style="margin:0">Tus bolos se apuntan en un calendario aparte de Google Calendar, sin tocar tus otros calendarios. Los cancelados se quitan solos.</p>
      <div class="field"><label for="gc-nombre">Nombre del calendario en Google</label><input id="gc-nombre" value="${esc(A.gcalNombre||"Mis Bolos")}"></div>
      <div id="gc-estado" class="small"></div>
      <div class="actions" style="margin:0"><button class="btn" type="button" id="gc-conectar">${A.gcalId?"Volver a buscar":"Buscar calendario y activar"}</button>
      ${A.gcalId?'<button class="btn" type="button" id="gc-todo">Pasar todos los bolos</button>':""}</div>
      ${A.gcalId?`<label class="switch" style="background:var(--surface)"><span>Sincronizar al guardar</span><input type="checkbox" id="gc-on"${A.gcalOn?" checked":""}></label>`:""}
    </div>
    <h2><span>Copia de seguridad</span></h2>
    <p class="small muted" style="margin:0 4px 10px">${S.storeKind==="nube"?"Tus datos se guardan en tu cuenta de Claude. Aun así, una copia de vez en cuando no sobra.":"Se guardan solo en este dispositivo. Descarga una copia de vez en cuando."}</p>
    <div class="actions"><button class="btn" type="button" id="x-json">Descargar copia</button><button class="btn" type="button" id="x-import">Restaurar copia</button></div>
    <div class="actions"><button class="btn" type="button" id="x-csv-b">Bolos para Excel</button><button class="btn" type="button" id="x-csv-g">Gastos para Excel</button></div>`;
  openSheet(html,root=>{
    const f=root.querySelector("#f-aj");
    f.irpfOn.addEventListener("change",()=>{ root.querySelector("#a-irpf-wrap").hidden=!f.irpfOn.checked; });
    f.addEventListener("submit",async e=>{
      e.preventDefault(); const fd=new FormData(f);
      const o={...S.ajustes,plazo:num(fd.get("plazo"))||30,irpfOn:!!fd.get("irpfOn"),irpf:num(fd.get("irpf"))};
      if(await Store.put("ajustes","general",o)){ closeSheet(); toast("Ajustes guardados"); }
    });
    const gcEstado=root.querySelector("#gc-estado");
    const paintGc=()=>{ gcEstado.innerHTML = S.ajustes.gcalId
        ? (S.ajustes.gcalOn?'<span class="chip c-ok">Activado</span> ':'<span class="chip c-plain">En pausa</span> ')+'Usando el calendario «'+esc(S.ajustes.gcalNombre)+'».'
        : '<span class="muted">Aún sin activar.</span>'; };
    paintGc();
    root.querySelector("#gc-conectar").addEventListener("click",async ev=>{
      const btn=ev.currentTarget, nombre=root.querySelector("#gc-nombre").value.trim()||"Mis Bolos";
      btn.disabled=true; gcEstado.textContent="Buscando «"+nombre+"» en tu Google Calendar…";
      try{
        const cid=await GCal.findCalendar(nombre);
        if(!cid){ gcEstado.innerHTML='<span class="chip c-warn">No encontrado</span> No tienes ningún calendario llamado «'+esc(nombre)+'». Créalo en calendar.google.com desde el navegador (versión para ordenador): «Otros calendarios» → «+» → «Crear calendario», ponle ese nombre y vuelve a pulsar este botón.'; btn.disabled=false; return; }
        const na={...S.ajustes,gcalId:cid,gcalNombre:nombre,gcalOn:true};
        if(await Store.put("ajustes","general",na)){ S.ajustes=na; toast("Calendario conectado"); ajustesForm(); }

      }catch(e){ gcEstado.innerHTML='<span class="chip c-bad">Error</span> '+esc(GCal.errText(e)); btn.disabled=false; }
    });
    const gcOn=root.querySelector("#gc-on");
    if(gcOn) gcOn.addEventListener("change",async()=>{ const na={...S.ajustes,gcalOn:gcOn.checked}; if(await Store.put("ajustes","general",na)){ S.ajustes=na; paintGc(); toast(na.gcalOn?"Sincronización activada":"Sincronización en pausa"); } });
    const gcTodo=root.querySelector("#gc-todo");
    if(gcTodo) gcTodo.addEventListener("click",async()=>{
      if(!S.ajustes.gcalOn){ toast("Activa «Sincronizar al guardar» primero"); return; }
      gcTodo.disabled=true;

      gcTodo.disabled=false; gcTodo.textContent="Pasar todos los bolos";
      gcEstado.innerHTML = r.fails ? '<span class="chip c-warn">'+r.n+' de '+r.total+'</span> '+esc(GCal.errText(r.lastErr)) : '<span class="chip c-ok">Hecho</span> '+plural(r.n,"bolo","bolos")+' al día en «'+esc(S.ajustes.gcalNombre)+'».';
    });
    root.querySelector("#x-json").addEventListener("click",exportJSON);
    root.querySelector("#x-import").addEventListener("click",()=>$("#import-file").click());
    root.querySelector("#x-csv-b").addEventListener("click",()=>exportCSV("bolos"));
    root.querySelector("#x-csv-g").addEventListener("click",()=>exportCSV("gastos"));
  });
}

/* ---------- export / import ---------- */
async function saveFile(filename,data){
  let dl=null; try{ dl = window.claude && await window.claude.use("downloads"); }catch(e){}
  if(!dl){ toast("Descargar no está disponible en esta vista"); return; }
  try{ const r=await dl.save({filename,data}); if(r && r.status==="saved") toast("Archivo guardado"); }
  catch(e){ if(e && e.code!=="cancelled" && e.code!=="declined") toast("No se pudo guardar el archivo"); }
}
const csvCell = v => { const s=String(v==null?"":v); return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const dec = n => String(r2(n)).replace(".",",");
function exportCSV(kind){
  let rows;
  if(kind==="bolos"){
    rows=[["Fecha","Hasta","Empresa","Evento","Lugar","Hora","Precio","Estado","Cobrado","Fecha de cobro","Te deben","Gastos del bolo","Te deja","Notas"]];
    bolosArr().sort(porFecha).forEach(b=>{ const g=suma(gastosDe(b.id),x=>num(x.importe));
      rows.push([b.fecha,b.fechaFin,b.empresa,b.evento,b.lugar,b.hora,dec(importe(b)),estadoTxt(b),pagado(b)?"Sí":b.pago==="parcial"?"En parte":"No",b.fechaCobro,dec(deudaDe(b)),dec(g),dec(importe(b)-g),b.notas]); });
  } else {
    rows=[["Fecha","Tipo","Importe","Bolo","Nota"]];
    gastosArr().sort(porFecha).forEach(g=>{ const b=g.boloId?S.bolos.get(g.boloId):null;
      rows.push([g.fecha,catLabel(g.categoria),dec(num(g.importe)),b?tituloDe(b):"",g.concepto]); });
  }
  saveFile(kind+"-"+TODAY+".csv","﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"));
}
function exportJSON(){
  saveFile("mis-bolos-copia-"+TODAY+".json",JSON.stringify({app:"mis-bolos",version:1,fecha:TODAY,bolos:Object.fromEntries(S.bolos),gastos:Object.fromEntries(S.gastos),empresas:Object.fromEntries(S.empresas),ajustes:S.ajustes},null,1));
}
$("#import-file").addEventListener("change",async e=>{
  const file=e.target.files[0]; e.target.value=""; if(!file) return;
  try{
    const o=JSON.parse(await file.text());
    if(o.app!=="mis-bolos") throw new Error("formato");
    let n=0;
    for(const col of ["bolos","gastos","empresas"]) for(const [id,d] of Object.entries(o[col]||{})){ if(/^[A-Za-z0-9_.~:@+-]+$/.test(id) && d && typeof d==="object"){ await Store.put(col,id,d); n++; } }
    if(o.ajustes) await Store.put("ajustes","general",{...DEF_AJUSTES,...o.ajustes});
    closeSheet(); toast(n+" registros restaurados");
  }catch(err){ toast("Ese archivo no es una copia de Mis Bolos"); }
});

/* ---------- events ---------- */
function setTab(t){ UI.tab=t; try{ history.replaceState(null,"","#"+t); }catch(e){} render(); window.scrollTo(0,0); }
$("#btn-ajustes").addEventListener("click",ajustesForm);
$("#fab").addEventListener("click",()=>{
  if(UI.tab==="gastos") gastoForm(null);
  else boloForm(null, UI.bolosView==="cal" && UI.dia ? {fecha:UI.dia} : null);
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  UI.q=e.target.value; const el=$("#bolos-body"); if(el) el.innerHTML=bolosBody();
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-quick],[data-add],[data-tab],[data-mes],[data-bview],[data-dia],[data-nuevo-dia],[data-bolo],[data-gasto]");
  if(!t) return;
  const d=t.dataset;
  if(d.quick){ const [id,accion]=d.quick.split("|"); t.disabled=true; if(!$("#sheet").hidden) closeSheet(); quick(id,accion); return; }
  if(d.add) return d.add==="gasto" ? gastoForm(null) : boloForm(null);
  if(d.tab) return setTab(d.tab);
  if(d.mes!==undefined){
    const k=Number(d.mes);
    if(k===0){ UI.y=now.getFullYear(); UI.m=now.getMonth(); }
    else { UI.m+=k; if(UI.m<0){ UI.m=11; UI.y--; } if(UI.m>11){ UI.m=0; UI.y++; } }
    UI.dia=null; return render();
  }
  if(d.bview){ UI.bolosView=d.bview; UI.dia=null; return render(); }
  if(d.dia){ UI.dia = UI.dia===d.dia ? null : d.dia; return render(); }
  if(d.nuevoDia) return boloForm(null,{fecha:d.nuevoDia});
  if(d.bolo) return boloForm(d.bolo);
  if(d.gasto) return gastoForm(d.gasto);
});
function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h==="bolos"||h==="gastos"||h==="inicio") UI.tab=h;
  else if(h==="resumen"||h==="empresas") UI.tab="inicio";
}
window.addEventListener("hashchange",()=>{ fromHash(); render(); });
fromHash();
render();
Store.init();
})();
</script>
